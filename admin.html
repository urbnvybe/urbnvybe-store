<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | URBNVYBE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#111;min-height:100vh}
header{background:#111;color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:800;letter-spacing:2px}
.header-right{display:flex;align-items:center;gap:15px;font-size:14px}
.logout-btn{background:#fff;color:#111;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:600}

#loginScreen{max-width:400px;margin:100px auto;background:#fff;padding:40px;border-radius:10px;box-shadow:0 5px 25px rgba(0,0,0,.08);text-align:center}
#loginScreen h1{margin-bottom:10px;font-size:24px}
#loginScreen p{color:#666;margin-bottom:25px;font-size:14px}
#loginScreen input{width:100%;padding:14px;border:1px solid #ccc;border-radius:5px;font-size:15px;margin-bottom:15px}
#loginScreen button{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:5px;font-size:15px;font-weight:700;cursor:pointer}
.error-msg{color:#c00;font-size:13px;margin-top:10px;display:none}

#adminApp{display:none}
.container{max-width:1300px;margin:0 auto;padding:20px}

.tabs{display:flex;gap:8px;margin-bottom:25px;flex-wrap:wrap}
.tab{padding:11px 18px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
.tab.active{background:#111;color:#fff;border-color:#111}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center}
.search-box{flex:1;min-width:200px;padding:11px 14px;border:1px solid #ccc;border-radius:5px;font-size:14px}
select,.btn{padding:11px 16px;border:1px solid #ccc;border-radius:5px;font-size:14px;background:#fff;cursor:pointer}
.btn-primary{background:#111;color:#fff;border-color:#111;font-weight:600}
.btn-success{background:#2e7d32;color:#fff;border:none;font-weight:600}
.btn-whatsapp{background:#25D366;color:#fff;border:none;font-weight:600}
.btn-sm{padding:6px 11px;font-size:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:25px}
.stat-card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:center}
.stat-card .num{font-size:28px;font-weight:800}
.stat-card .label{font-size:12px;color:#777;margin-top:5px}

.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px}
@media(max-width:900px){.dashboard-grid{grid-template-columns:1fr}}

.card{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.05);padding:20px}
.card h3{font-size:16px;margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px}

.table-wrap{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f8f8;text-align:left;padding:12px;font-weight:700;border-bottom:1px solid #eee;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:hover{background:#fafafa}
.clickable{cursor:pointer}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-new,.badge-pending{background:#fff8e1;color:#f9a825}
.badge-confirmed,.badge-paid,.badge-active{background:#e8f5e9;color:#2e7d32}
.badge-processing{background:#fff3e0;color:#ef6c00}
.badge-shipped{background:#f3e5f5;color:#7b1fa2}
.badge-delivered{background:#e0f2f1;color:#00695c}
.badge-cancelled,.badge-inactive{background:#ffebee;color:#c62828}
.badge-bogo{background:#e3f2fd;color:#1565c0}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal{background:#fff;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;border-radius:10px;padding:28px}
.modal h2{margin-bottom:18px;font-size:20px}
.modal-section{margin-bottom:20px}
.modal-section h3{font-size:13px;color:#666;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.info-grid div{background:#f9f9f9;padding:10px;border-radius:5px}
.info-grid strong{display:block;font-size:11px;color:#888;margin-bottom:3px}
.item-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:14px}
.form-row textarea{min-height:70px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:5px;font-weight:700;cursor:pointer;font-size:14px;border:none}
.btn-dark{background:#111;color:#fff}
.btn-light{background:#eee;color:#111}
.close-btn{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:#666}

.variant-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.variant-table th,.variant-table td{padding:8px;border:1px solid #eee;text-align:left}
.variant-table input,.variant-table select{padding:6px;width:100%;border:1px solid #ccc;border-radius:4px}

.empty{text-align:center;padding:50px 20px;color:#777}
.loading{text-align:center;padding:40px;color:#666}
.top-product{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}

@media(max-width:700px){
  .info-grid,.form-grid,.form-grid-3{grid-template-columns:1fr}
  .tabs{gap:6px}
  .tab{padding:10px 14px;font-size:13px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>URBNVYBE Admin</h1>
  <p>Enter password to continue</p>
  <input type="password" id="passwordInput" placeholder="Password" autofocus>
  <button onclick="login()">LOGIN</button>
  <div class="error-msg" id="loginError">Wrong password</div>
</div>

<div id="adminApp">
  <header>
    <div class="logo">URBNVYBE Admin</div>
    <div class="header-right">
      <span id="headerInfo">—</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <div class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</div>
      <div class="tab" data-tab="orders" onclick="switchTab('orders')">Orders</div>
      <div class="tab" data-tab="products" onclick="switchTab('products')">Products</div>
      <div class="tab" data-tab="customers" onclick="switchTab('customers')">Customers</div>
      <div class="tab" data-tab="coupons" onclick="switchTab('coupons')">Coupons</div>
    </div>

    <!-- DASHBOARD -->
    <div id="tab-dashboard">
      <div class="stats" id="dashStats"></div>
      <div class="dashboard-grid">
        <div class="card">
          <h3>Recent Orders</h3>
          <div id="recentOrders"><div class="loading">Loading...</div></div>
        </div>
        <div class="card">
          <h3>Top Products</h3>
          <div id="topProducts"><div class="loading">Loading...</div></div>
        </div>
      </div>
    </div>

    <!-- ORDERS -->
    <div id="tab-orders" style="display:none">
      <div class="stats" id="orderStats"></div>
      <div class="toolbar">
        <input class="search-box" id="orderSearch" placeholder="Search Order ID, Name, Phone..." oninput="filterOrders()">
        <select id="orderStatusFilter" onchange="filterOrders()">
          <option value="">All Order Status</option>
          <option value="New">New</option><option value="Confirmed">Confirmed</option>
          <option value="Processing">Processing</option><option value="Shipped">Shipped</option>
          <option value="Delivered">Delivered</option><option value="Cancelled">Cancelled</option>
        </select>
        <select id="paymentFilter" onchange="filterOrders()">
          <option value="">All Payment</option>
          <option value="Pending">Pending</option><option value="Paid">Paid</option>
          <option value="Failed">Failed</option><option value="Refunded">Refunded</option>
        </select>
        <button class="btn btn-primary" onclick="loadOrders()">↻ Refresh</button>
      </div>
      <div class="table-wrap"><div id="ordersTable"><div class="loading">Loading...</div></div></div>
    </div>

    <!-- PRODUCTS -->
    <div id="tab-products" style="display:none">
      <div class="toolbar">
        <input class="search-box" id="productSearch" placeholder="Search products..." oninput="filterProducts()">
        <button class="btn btn-success" onclick="openProductModal()">+ Add Product</button>
        <button class="btn btn-primary" onclick="loadProducts()">↻ Refresh</button>
      </div>
      <div class="table-wrap"><div id="productsTable"><div class="loading">Loading...</div></div></div>
    </div>

    <!-- CUSTOMERS -->
    <div id="tab-customers" style="display:none">
      <div class="toolbar">
        <input class="search-box" id="customerSearch" placeholder="Search name, phone, email..." oninput="filterCustomers()">
        <button class="btn btn-primary" onclick="loadCustomers()">↻ Refresh</button>
      </div>
      <div class="table-wrap"><div id="customersTable"><div class="loading">Loading...</div></div></div>
    </div>

    <!-- COUPONS -->
    <div id="tab-coupons" style="display:none">
      <div class="toolbar">
        <input class="search-box" id="couponSearch" placeholder="Search coupon code..." oninput="filterCoupons()">
        <button class="btn btn-success" onclick="openCouponModal()">+ Add Coupon</button>
        <button class="btn btn-primary" onclick="loadCoupons()">↻ Refresh</button>
      </div>
      <div class="table-wrap"><div id="couponsTable"><div class="loading">Loading...</div></div></div>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="orderModal"><div class="modal"><button class="close-btn" onclick="closeOrderModal()">×</button><h2 id="orderModalTitle">Order Details</h2><div id="orderModalContent"></div></div></div>
<div class="modal-overlay" id="productModal"><div class="modal"><button class="close-btn" onclick="closeProductModal()">×</button><h2 id="productModalTitle">Add Product</h2><div id="productModalContent"></div></div></div>
<div class="modal-overlay" id="variantsModal"><div class="modal"><button class="close-btn" onclick="closeVariantsModal()">×</button><h2 id="variantsModalTitle">Manage Variants</h2><div id="variantsModalContent"></div></div></div>
<div class="modal-overlay" id="couponModal"><div class="modal"><button class="close-btn" onclick="closeCouponModal()">×</button><h2 id="couponModalTitle">Add Coupon</h2><div id="couponModalContent"></div></div></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyo1cxZFeA3uN13nY02kPUITiatINQOJ8KbzGecmVWxXKbhG3cSVfE9OZNTE_C_SyITuQ/exec";

let adminPassword = "";
let allOrders = [], allProducts = [], allCustomers = [], allCoupons = [];
let currentOrderId = null, editingProductId = null, currentVariantProductId = null, editingCouponId = null;

function login() {
  const pass = document.getElementById("passwordInput").value.trim();
  if (!pass) return;
  adminPassword = pass;
  document.getElementById("loginError").style.display = "none";
  loadDashboard().then(ok => {
    if (ok) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminApp").style.display = "block";
      localStorage.setItem("urbnvybe_admin_pass", pass);
    } else {
      document.getElementById("loginError").style.display = "block";
      adminPassword = "";
    }
  });
}
function logout(){ adminPassword=""; localStorage.removeItem("urbnvybe_admin_pass"); location.reload(); }
window.onload = function(){ const s=localStorage.getItem("urbnvybe_admin_pass"); if(s){ document.getElementById("passwordInput").value=s; login(); } };
document.getElementById("passwordInput").addEventListener("keypress", e => { if(e.key==="Enter") login(); });

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add("active");
  ["dashboard","orders","products","customers","coupons"].forEach(t => {
    document.getElementById("tab-"+t).style.display = t===tab ? "block" : "none";
  });
  if(tab==="orders" && !allOrders.length) loadOrders();
  if(tab==="products" && !allProducts.length) loadProducts();
  if(tab==="customers" && !allCustomers.length) loadCustomers();
  if(tab==="coupons" && !allCoupons.length) loadCoupons();
  if(tab==="dashboard") loadDashboard();
}

/* ==================== DASHBOARD ==================== */
async function loadDashboard() {
  try {
    const res = await fetch(API_URL + "?action=admin_dashboard&password=" + encodeURIComponent(adminPassword));
    const data = await res.json();
    if (!data.success) return false;

    const d = data.data;
    document.getElementById("headerInfo").textContent = d.totalOrders + " total orders";

    document.getElementById("dashStats").innerHTML = `
      <div class="stat-card"><div class="num">${d.todayOrders}</div><div class="label">Today's Orders</div></div>
      <div class="stat-card"><div class="num">₹${Number(d.todayRevenue||0).toLocaleString("en-IN")}</div><div class="label">Today's Revenue</div></div>
      <div class="stat-card"><div class="num">${d.pendingOrders}</div><div class="label">Pending / New</div></div>
      <div class="stat-card"><div class="num">${d.shippedOrders}</div><div class="label">Shipped</div></div>
      <div class="stat-card"><div class="num">${d.totalOrders}</div><div class="label">Total Orders</div></div>
      <div class="stat-card"><div class="num">₹${Number(d.totalRevenue||0).toLocaleString("en-IN")}</div><div class="label">Total Revenue</div></div>
    `;

    // Recent Orders - now with Name, Mobile, Email
    let recentHtml = "";
    if (d.recentOrders && d.recentOrders.length) {
      recentHtml = `<table><thead><tr>
        <th>Order ID</th><th>Customer</th><th>Mobile</th><th>Email</th><th>Total</th><th>Status</th>
      </tr></thead><tbody>`;
      d.recentOrders.forEach(o => {
        recentHtml += `<tr class="clickable" onclick="switchTab('orders'); setTimeout(()=>openOrder('${o.OrderID}'),300)">
          <td><strong>${esc(o.OrderID)}</strong></td>
          <td>${esc(o.CustomerName || "-")}</td>
          <td>${esc(o.Phone || o.Mobile || "-")}</td>
          <td>${esc(o.Email || "-")}</td>
          <td>₹${Number(o.Total||0).toLocaleString("en-IN")}</td>
          <td><span class="badge badge-${(o.OrderStatus||"new").toLowerCase()}">${esc(o.OrderStatus||"New")}</span></td>
        </tr>`;
      });
      recentHtml += `</tbody></table>`;
    } else {
      recentHtml = '<div class="empty">No recent orders</div>';
    }
    document.getElementById("recentOrders").innerHTML = recentHtml;

    // Top Products
    let topHtml = "";
    if (d.topProducts && d.topProducts.length) {
      d.topProducts.forEach((p, i) => {
        topHtml += `<div class="top-product"><span>${i+1}. ${esc(p.name)}</span><strong>${p.qty} sold</strong></div>`;
      });
    } else {
      topHtml = '<div class="empty">No data yet</div>';
    }
    document.getElementById("topProducts").innerHTML = topHtml;

    return true;
  } catch(e) {
    return false;
  }
}

/* ==================== ORDERS ==================== */
async function loadOrders() {
  const box = document.getElementById("ordersTable");
  box.innerHTML = '<div class="loading">Loading orders...</div>';
  try {
    const res = await fetch(API_URL+"?action=admin_orders&password="+encodeURIComponent(adminPassword));
    const data = await res.json();
    if(!data.success){ box.innerHTML=`<div class="empty">${data.error||"Failed"}</div>`; return false; }
    allOrders = data.orders||[];
    renderOrderStats(); filterOrders(); return true;
  } catch(e){ box.innerHTML='<div class="empty">Network error</div>'; return false; }
}
function renderOrderStats(){
  const total=allOrders.length;
  const neu=allOrders.filter(o=>(o.OrderStatus||"").toLowerCase()==="new").length;
  const shipped=allOrders.filter(o=>(o.OrderStatus||"").toLowerCase()==="shipped").length;
  const delivered=allOrders.filter(o=>(o.OrderStatus||"").toLowerCase()==="delivered").length;
  document.getElementById("orderStats").innerHTML=`
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Orders</div></div>
    <div class="stat-card"><div class="num">${neu}</div><div class="label">New</div></div>
    <div class="stat-card"><div class="num">${shipped}</div><div class="label">Shipped</div></div>
    <div class="stat-card"><div class="num">${delivered}</div><div class="label">Delivered</div></div>`;
}
function filterOrders(){
  const q=document.getElementById("orderSearch").value.toLowerCase();
  const st=document.getElementById("orderStatusFilter").value;
  const pay=document.getElementById("paymentFilter").value;
  const filtered=allOrders.filter(o=>{
    const matchQ=!q||String(o.OrderID||"").toLowerCase().includes(q)||String(o.CustomerName||"").toLowerCase().includes(q)||String(o.Phone||o.Mobile||"").toLowerCase().includes(q);
    return matchQ&&(!st||o.OrderStatus===st)&&(!pay||o.PaymentStatus===pay);
  });
  renderOrdersTable(filtered);
}
function renderOrdersTable(list){
  const box=document.getElementById("ordersTable");
  if(!list.length){box.innerHTML='<div class="empty">No orders found</div>';return;}
  let html=`<table><thead><tr>
    <th>Order ID</th><th>Date</th><th>Customer Name</th><th>Phone</th><th>Email</th><th>Total</th><th>Payment</th><th>Status</th>
  </tr></thead><tbody>`;
  list.forEach(o=>{
    const date=o.OrderDate?new Date(o.OrderDate).toLocaleDateString("en-IN"):"-";
    html+=`<tr class="clickable" onclick="openOrder('${o.OrderID}')">
      <td><strong>${esc(o.OrderID)}</strong></td>
      <td>${date}</td>
      <td><strong>${esc(o.CustomerName || "-")}</strong></td>
      <td>${esc(o.Phone||o.Mobile||"-")}</td>
      <td>${esc(o.Email||"-")}</td>
      <td>₹${Number(o.Total||0).toLocaleString("en-IN")}</td>
      <td><span class="badge badge-${(o.PaymentStatus||"pending").toLowerCase()}">${esc(o.PaymentStatus||"Pending")}</span></td>
      <td><span class="badge badge-${(o.OrderStatus||"new").toLowerCase()}">${esc(o.OrderStatus||"New")}</span></td>
    </tr>`;
  });
  box.innerHTML=html+`</tbody></table>`;
}
async function openOrder(id){
  currentOrderId=id;
  const modal=document.getElementById("orderModal");
  const content=document.getElementById("orderModalContent");
  document.getElementById("orderModalTitle").textContent="Order "+id;
  content.innerHTML='<div class="loading">Loading...</div>';
  modal.style.display="flex";
  try{
    const res=await fetch(API_URL+"?action=admin_order_details&password="+encodeURIComponent(adminPassword)+"&orderId="+encodeURIComponent(id));
    const data=await res.json();
    if(!data.success){content.innerHTML=`<div class="empty">${data.error}</div>`;return;}
    const o=data.order; const items=data.items||[];
    let itemsHtml=items.map(it=>`<div class="item-row"><div><strong>${esc(it.ProductName||it.productName)}</strong><br><small>${esc(it.Size)} | ${esc(it.Color||it.ColorCode)} | ${esc(it.SKU)}</small></div>
      <div style="text-align:right">Qty: ${it.Quantity||it.quantity||1}<br>₹${Number(it.Total||it.LineTotal||it.Price||0).toLocaleString("en-IN")}</div></div>`).join("")||"<p>No items</p>";
    content.innerHTML=`
      <div class="modal-section"><h3>Customer</h3>
        <div class="info-grid">
          <div><strong>Name</strong>${esc(o.CustomerName)}</div>
          <div><strong>Phone</strong>${esc(o.Phone||o.Mobile)}</div>
          <div><strong>Email</strong>${esc(o.Email)}</div>
          <div><strong>City</strong>${esc(o.City)}</div>
        </div>
        <div style="margin-top:10px;background:#f9f9f9;padding:10px;border-radius:5px;font-size:14px">${esc(o.Address)}, ${esc(o.City)}, ${esc(o.State)} - ${esc(o.Pincode||o.PINCode)}</div>
      </div>
      <div class="modal-section"><h3>Items</h3>${itemsHtml}</div>
      <div class="modal-section"><h3>Update Order</h3>
        <div class="form-grid">
          <div class="form-row"><label>Order Status</label>
            <select id="editOrderStatus"><option>New</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select>
          </div>
          <div class="form-row"><label>Payment Status</label>
            <select id="editPaymentStatus"><option>Pending</option><option>Paid</option><option>Failed</option><option>Refunded</option></select>
          </div>
        </div>
        <div class="form-row"><label>Tracking Number</label><input id="editTrackingNumber" value="${esc(o.TrackingNumber)}"></div>
        <div class="form-row"><label>Tracking URL</label><input id="editTrackingURL" value="${esc(o.TrackingURL)}"></div>
        <div class="form-row"><label>Admin Notes</label><textarea id="editNotes">${esc(o.Notes)}</textarea></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-dark" onclick="saveOrder()">Save Changes</button>
        <button class="btn btn-light" onclick="closeOrderModal()">Close</button>
      </div>`;
    document.getElementById("editOrderStatus").value=o.OrderStatus||"New";
    document.getElementById("editPaymentStatus").value=o.PaymentStatus||"Pending";
  }catch(e){content.innerHTML='<div class="empty">Failed to load</div>';}
}
async function saveOrder(){
  const payload={action:"admin_update_order",password:adminPassword,orderId:currentOrderId,
    orderStatus:document.getElementById("editOrderStatus").value,
    paymentStatus:document.getElementById("editPaymentStatus").value,
    trackingNumber:document.getElementById("editTrackingNumber").value.trim(),
    trackingURL:document.getElementById("editTrackingURL").value.trim(),
    notes:document.getElementById("editNotes").value.trim()};
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.success) return alert(data.error||"Failed");
    alert("Order updated!"); closeOrderModal(); loadOrders(); loadDashboard();
  }catch(e){alert("Network error");}
}
function closeOrderModal(){document.getElementById("orderModal").style.display="none";}

/* ==================== PRODUCTS ==================== */
async function loadProducts(){
  const box=document.getElementById("productsTable");
  box.innerHTML='<div class="loading">Loading products...</div>';
  try{
    const res=await fetch(API_URL+"?action=admin_products&password="+encodeURIComponent(adminPassword));
    const data=await res.json();
    if(!data.success){box.innerHTML=`<div class="empty">${data.error}</div>`;return;}
    allProducts=data.products||[]; filterProducts();
  }catch(e){box.innerHTML='<div class="empty">Network error</div>';}
}
function filterProducts(){
  const q=document.getElementById("productSearch").value.toLowerCase();
  const filtered=allProducts.filter(p=>!q||String(p.ProductName||"").toLowerCase().includes(q)||String(p.ProductID||"").toLowerCase().includes(q)||String(p.Category||"").toLowerCase().includes(q));
  renderProductsTable(filtered);
}
function renderProductsTable(list){
  const box=document.getElementById("productsTable");
  if(!list.length){box.innerHTML='<div class="empty">No products found</div>';return;}
  let html=`<table><thead><tr><th>Image</th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Variants</th><th>Actions</th></tr></thead><tbody>`;
  list.forEach(p=>{
    const img=p.MainImage?`<img src="${esc(p.MainImage)}" style="width:45px;height:45px;object-fit:cover;border-radius:4px">`:"—";
    const statusClass=(p.Status||"").toLowerCase()==="active"?"active":"inactive";
    html+=`<tr>
      <td>${img}</td><td>${esc(p.ProductID)}</td><td><strong>${esc(p.ProductName)}</strong></td>
      <td>${esc(p.Category)}</td><td>₹${Number(p.Price||0).toLocaleString("en-IN")}</td>
      <td><span class="badge badge-${statusClass}">${esc(p.Status||"Active")}</span></td>
      <td>${(p.variants||[]).length}</td>
      <td>
        <button class="btn btn-primary btn-sm" onclick="openProductModal('${p.ProductID}')">Edit</button>
        <button class="btn btn-success btn-sm" onclick="openVariantsModal('${p.ProductID}')">Variants</button>
      </td></tr>`;
  });
  box.innerHTML=html+`</tbody></table>`;
}

  const modal=document.getElementById("productModal");
  const content=document.getElementById("productModalContent");
  const title=document.getElementById("productModalTitle");

  title.textContent=productId?"Edit Product — "+productId:"Add New Product";

  content.innerHTML = `
    <div class="form-grid">
      <div class="form-row"><label>Product Name *</label><input id="pName" value="${esc(p.ProductName)}"></div>
      <div class="form-row"><label>Category</label><input id="pCategory" value="${esc(p.Category)}"></div>
    </div>
    <div class="form-row"><label>Description</label><textarea id="pDesc">${esc(p.Description)}</textarea></div>
    <div class="form-grid">
      <div class="form-row"><label>Price *</label><input type="number" id="pPrice" value="${p.Price||""}"></div>
      <div class="form-row"><label>Compare Price</label><input type="number" id="pCompare" value="${p.ComparePrice||""}"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Brand</label><input id="pBrand" value="${esc(p.Brand)}"></div>
      <div class="form-row"><label>Material</label><input id="pMaterial" value="${esc(p.Material)}"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Gender</label>
        <select id="pGender"><option value="">—</option><option>Men</option><option>Women</option><option>Unisex</option></select>
      </div>
      <div class="form-row"><label>Status</label>
        <select id="pStatus"><option>Active</option><option>Inactive</option></select>
      </div>
    </div>

    <div class="modal-section"><h3>Images (6 slots)</h3>
      <div class="form-grid">
        <div class="form-row"><label>Main Image</label><input id="pMainImage" value="${esc(p.MainImage)}" placeholder="URL"></div>
        <div class="form-row"><label>Back Image</label><input id="pBackImage" value="${esc(p.BackImage)}" placeholder="URL"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Side Image</label><input id="pSideImage" value="${esc(p.SideImage)}" placeholder="URL"></div>
        <div class="form-row"><label>Sleeve Image</label><input id="pSleeveImage" value="${esc(p.SleeveImage)}" placeholder="URL"></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Collar Image</label><input id="pCollarImage" value="${esc(p.CollarImage)}" placeholder="URL"></div>
        <div class="form-row"><label>Model Image</label><input id="pModelImage" value="${esc(p.ModelImage)}" placeholder="URL"></div>
      </div>
    </div>

    <div class="modal-section"><h3>SEO</h3>
      <div class="form-row"><label>SEO Title</label><input id="pSeoTitle" value="${esc(p.SEO_Title)}" placeholder="Page title for Google"></div>
      <div class="form-row"><label>SEO Description</label><textarea id="pSeoDesc" placeholder="Meta description">${esc(p.SEO_Description)}</textarea></div>
    </div>

    <div class="form-row"><label>Tags (comma separated)</label><input id="pTags" value="${esc(p.Tags)}"></div>

    <div class="modal-actions">
      <button class="btn btn-dark" onclick="saveProduct()">${productId?"Update Product":"Add Product"}</button>
      <button class="btn btn-light" onclick="closeProductModal()">Cancel</button>
    </div>`;

  if(p.Gender) document.getElementById("pGender").value = p.Gender;
  if(p.Status) document.getElementById("pStatus").value = p.Status;
  modal.style.display = "flex";
}

async function saveProduct(){
  const name = document.getElementById("pName").value.trim();
  const price = document.getElementById("pPrice").value;
  if(!name || !price) return alert("Name and Price are required");

  const payload = {
    action: "admin_save_product",
    password: adminPassword,
    ProductID: editingProductId || "",
    ProductName: name,
    Category: document.getElementById("pCategory").value.trim(),
    Description: document.getElementById("pDesc").value.trim(),
    Price: Number(price),
    ComparePrice: Number(document.getElementById("pCompare").value) || "",
    Brand: document.getElementById("pBrand").value.trim(),
    Material: document.getElementById("pMaterial").value.trim(),
    Gender: document.getElementById("pGender").value,
    Status: document.getElementById("pStatus").value,
    MainImage: document.getElementById("pMainImage").value.trim(),
    BackImage: document.getElementById("pBackImage").value.trim(),
    SideImage: document.getElementById("pSideImage").value.trim(),
    SleeveImage: document.getElementById("pSleeveImage").value.trim(),
    CollarImage: document.getElementById("pCollarImage").value.trim(),
    ModelImage: document.getElementById("pModelImage").value.trim(),
    SEO_Title: document.getElementById("pSeoTitle").value.trim(),
    SEO_Description: document.getElementById("pSeoDesc").value.trim(),
    Tags: document.getElementById("pTags").value.trim()
  };

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!data.success) return alert(data.error || "Failed");
    alert(data.message || "Saved!");
    closeProductModal();
    loadProducts();
  }catch(e){ alert("Network error"); }
}
function closeProductModal(){ document.getElementById("productModal").style.display="none"; editingProductId=null; }

/* ==================== VARIANTS (same as before) ==================== */
async function openVariantsModal(productId){
  currentVariantProductId=productId;
  const modal=document.getElementById("variantsModal");
  const content=document.getElementById("variantsModalContent");
  const product=allProducts.find(p=>String(p.ProductID)===String(productId));
  document.getElementById("variantsModalTitle").textContent="Variants — "+(product?product.ProductName:productId);
  content.innerHTML='<div class="loading">Loading variants...</div>';
  modal.style.display="flex";
  try{
    const res=await fetch(API_URL+"?action=admin_variants&password="+encodeURIComponent(adminPassword)+"&productId="+encodeURIComponent(productId));
    const data=await res.json();
    if(!data.success){content.innerHTML=`<div class="empty">${data.error}</div>`;return;}
    const variants=data.variants||[];
    let rows=variants.map(v=>`
      <tr>
        <td>${esc(v.VariantID)}</td>
        <td><input id="size_${v.VariantID}" value="${esc(v.Size)}" style="width:70px"></td>
        <td><input id="stock_${v.VariantID}" type="number" value="${v.Stock||0}" style="width:70px"></td>
        <td><input id="price_${v.VariantID}" type="number" value="${v.Price||0}" style="width:80px"></td>
        <td><select id="status_${v.VariantID}"><option value="Active" ${v.Status==="Active"?"selected":""}>Active</option><option value="Inactive" ${v.Status==="Inactive"?"selected":""}>Inactive</option></select></td>
        <td><button class="btn btn-primary btn-sm" onclick="updateVariant('${v.VariantID}')">Save</button></td>
      </tr>`).join("");
    content.innerHTML=`
      <table class="variant-table"><thead><tr><th>ID</th><th>Size</th><th>Stock</th><th>Price</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows||"<tr><td colspan='6'>No variants yet</td></tr>"}</tbody></table>
      <div class="modal-section" style="margin-top:25px"><h3>Add New Size</h3>
        <div class="form-grid">
          <div class="form-row"><label>Size *</label><input id="newSize" placeholder="S / M / L / XL / XXL"></div>
          <div class="form-row"><label>Stock *</label><input type="number" id="newStock" value="10"></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>Price</label><input type="number" id="newPrice" value="${product?product.Price:499}"></div>
          <div class="form-row"><label>Color Code</label><input id="newColor" value="NAVY"></div>
        </div>
        <button class="btn btn-success" onclick="addVariant()">+ Add Variant</button>
      </div>
      <div class="modal-actions"><button class="btn btn-light" onclick="closeVariantsModal()">Close</button></div>`;
  }catch(e){content.innerHTML='<div class="empty">Failed to load variants</div>';}
}
async function updateVariant(variantId){
  const payload={action:"admin_save_variant",password:adminPassword,VariantID:variantId,
    Size:document.getElementById("size_"+variantId).value.trim(),
    Stock:Number(document.getElementById("stock_"+variantId).value),
    Price:Number(document.getElementById("price_"+variantId).value),
    Status:document.getElementById("status_"+variantId).value};
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.success) return alert(data.error||"Failed");
    alert("Variant updated"); openVariantsModal(currentVariantProductId); loadProducts();
  }catch(e){alert("Network error");}
}
async function addVariant(){
  const size=document.getElementById("newSize").value.trim();
  const stock=document.getElementById("newStock").value;
  if(!size||stock==="") return alert("Size and Stock are required");
  const payload={action:"admin_save_variant",password:adminPassword,ProductID:currentVariantProductId,
    Size:size,Stock:Number(stock),Price:Number(document.getElementById("newPrice").value)||0,
    ColorCode:document.getElementById("newColor").value.trim()||"NAVY",Status:"Active"};
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.success) return alert(data.error||"Failed");
    alert("Variant added!"); openVariantsModal(currentVariantProductId); loadProducts();
  }catch(e){alert("Network error");}
}
function closeVariantsModal(){document.getElementById("variantsModal").style.display="none";currentVariantProductId=null;}

/* ==================== CUSTOMERS + WhatsApp ==================== */
async function loadCustomers(){
  const box=document.getElementById("customersTable");
  box.innerHTML='<div class="loading">Loading customers...</div>';
  try{
    const res=await fetch(API_URL+"?action=admin_customers&password="+encodeURIComponent(adminPassword));
    const data=await res.json();
    if(!data.success){box.innerHTML=`<div class="empty">${data.error}</div>`;return;}
    allCustomers=data.customers||[]; filterCustomers();
  }catch(e){box.innerHTML='<div class="empty">Network error</div>';}
}
function filterCustomers(){
  const q=document.getElementById("customerSearch").value.toLowerCase();
  const filtered=allCustomers.filter(c=>!q||String(c.Name||"").toLowerCase().includes(q)||String(c.Phone||"").toLowerCase().includes(q)||String(c.Email||"").toLowerCase().includes(q));
  renderCustomersTable(filtered);
}
function renderCustomersTable(list){
  const box=document.getElementById("customersTable");
  if(!list.length){box.innerHTML='<div class="empty">No customers found</div>';return;}
  let html=`<table><thead><tr>
    <th>Name</th><th>Phone</th><th>Email</th><th>City</th><th>Orders</th><th>Total Spent</th><th>Last Order</th><th>WhatsApp</th>
  </tr></thead><tbody>`;
  list.forEach(c=>{
    const last=c.LastOrderDate?new Date(c.LastOrderDate).toLocaleDateString("en-IN"):"—";
    const phone = String(c.Phone||"").replace(/\D/g,"");
    const waLink = phone ? `https://wa.me/91${phone}?text=${encodeURIComponent("Hi "+(c.Name||"")+", check out our new collection at URBNVYBE!")}` : "#";
    html+=`<tr>
      <td><strong>${esc(c.Name||"-")}</strong></td>
      <td>${esc(c.Phone||"-")}</td>
      <td>${esc(c.Email||"-")}</td>
      <td>${esc(c.City||"-")}</td>
      <td>${c.TotalOrders||0}</td>
      <td>₹${Number(c.TotalSpent||0).toLocaleString("en-IN")}</td>
      <td>${last}</td>
      <td>${phone ? `<a href="${waLink}" target="_blank" class="btn btn-whatsapp btn-sm">WhatsApp</a>` : "-"}</td>
    </tr>`;
  });
  box.innerHTML=html+`</tbody></table>`;
}

/* ==================== COUPONS (same) ==================== */
async function loadCoupons(){
  const box=document.getElementById("couponsTable");
  box.innerHTML='<div class="loading">Loading coupons...</div>';
  try{
    const res=await fetch(API_URL+"?action=admin_coupons&password="+encodeURIComponent(adminPassword));
    const data=await res.json();
    if(!data.success){box.innerHTML=`<div class="empty">${data.error}</div>`;return;}
    allCoupons=data.coupons||[]; filterCoupons();
  }catch(e){box.innerHTML='<div class="empty">Network error</div>';}
}
function filterCoupons(){
  const q=document.getElementById("couponSearch").value.toLowerCase();
  const filtered=allCoupons.filter(c=>!q||String(c.Code||"").toLowerCase().includes(q)||String(c.Description||"").toLowerCase().includes(q));
  renderCouponsTable(filtered);
}
function renderCouponsTable(list){
  const box=document.getElementById("couponsTable");
  if(!list.length){box.innerHTML='<div class="empty">No coupons found</div>';return;}
  let html=`<table><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Min Order</th><th>Used</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
  list.forEach(c=>{
    const type=c.DiscountType||"percentage";
    const typeLabel=type==="bogo"?"BOGO":type==="fixed"?"Fixed ₹":"Percentage %";
    const value=type==="bogo"?"Buy 1 Get 1":(type==="fixed"?"₹"+c.DiscountValue:c.DiscountValue+"%");
    const statusClass=(c.Status||"").toLowerCase()==="active"?"active":"inactive";
    html+=`<tr>
      <td><strong>${esc(c.Code)}</strong></td>
      <td><span class="badge ${type==="bogo"?"badge-bogo":"badge-active"}">${typeLabel}</span></td>
      <td>${value}</td>
      <td>₹${Number(c.MinimumOrder||0).toLocaleString("en-IN")}</td>
      <td>${c.UsedCount||0}${c.UsageLimit?" / "+c.UsageLimit:""}</td>
      <td><span class="badge badge-${statusClass}">${esc(c.Status||"Active")}</span></td>
      <td><button class="btn btn-primary btn-sm" onclick="openCouponModal('${c.CouponID}')">Edit</button></td>
    </tr>`;
  });
  box.innerHTML=html+`</tbody></table>`;
}
function openCouponModal(couponId=null){
  editingCouponId=couponId;
  const modal=document.getElementById("couponModal");
  const content=document.getElementById("couponModalContent");
  const title=document.getElementById("couponModalTitle");
  let c=couponId?(allCoupons.find(x=>String(x.CouponID)===String(couponId))||{}):{};
  title.textContent=couponId?"Edit Coupon — "+c.Code:"Add New Coupon";
  content.innerHTML=`
    <div class="form-grid">
      <div class="form-row"><label>Coupon Code *</label><input id="cCode" value="${esc(c.Code)}" style="text-transform:uppercase"></div>
      <div class="form-row"><label>Discount Type *</label>
        <select id="cType" onchange="toggleCouponFields()">
          <option value="percentage">Percentage (%)</option>
          <option value="fixed">Fixed Amount (₹)</option>
          <option value="bogo">BOGO (Buy One Get One)</option>
        </select>
      </div>
    </div>
    <div class="form-grid" id="valueFields">
      <div class="form-row"><label id="valueLabel">Discount Value *</label><input type="number" id="cValue" value="${c.DiscountValue||""}"></div>
      <div class="form-row"><label>Maximum Discount (₹)</label><input type="number" id="cMaxDiscount" value="${c.MaximumDiscount||""}"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Minimum Order (₹)</label><input type="number" id="cMinOrder" value="${c.MinimumOrder||0}"></div>
      <div class="form-row"><label>Usage Limit</label><input type="number" id="cUsageLimit" value="${c.UsageLimit||""}"></div>
    </div>
    <div class="form-grid">
      <div class="form-row"><label>Start Date</label><input type="date" id="cStartDate"></div>
      <div class="form-row"><label>End Date</label><input type="date" id="cEndDate"></div>
    </div>
    <div class="form-row"><label>Status</label>
      <select id="cStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
    </div>
    <div class="form-row"><label>Description</label><input id="cDesc" value="${esc(c.Description)}"></div>
    <div class="modal-actions">
      <button class="btn btn-dark" onclick="saveCoupon()">${couponId?"Update Coupon":"Create Coupon"}</button>
      <button class="btn btn-light" onclick="closeCouponModal()">Cancel</button>
    </div>`;
  if(c.DiscountType) document.getElementById("cType").value=c.DiscountType;
  if(c.Status) document.getElementById("cStatus").value=c.Status;
  if(c.StartDate) document.getElementById("cStartDate").value=formatDateInput(c.StartDate);
  if(c.EndDate) document.getElementById("cEndDate").value=formatDateInput(c.EndDate);
  toggleCouponFields();
  modal.style.display="flex";
}
function toggleCouponFields(){
  const type=document.getElementById("cType").value;
  const valueFields=document.getElementById("valueFields");
  const valueLabel=document.getElementById("valueLabel");
  if(type==="bogo"){ valueFields.style.display="none"; }
  else { valueFields.style.display="grid"; valueLabel.textContent = type==="fixed" ? "Discount Amount (₹) *" : "Discount Percentage (%) *"; }
}
function formatDateInput(d){ if(!d) return ""; const date=new Date(d); if(isNaN(date)) return ""; return date.toISOString().split("T")[0]; }
async function saveCoupon(){
  const code=document.getElementById("cCode").value.trim().toUpperCase();
  const type=document.getElementById("cType").value;
  if(!code) return alert("Coupon Code is required");
  if(type!=="bogo" && !document.getElementById("cValue").value) return alert("Discount Value is required");
  const payload={
    action:"admin_save_coupon", password:adminPassword, CouponID: editingCouponId||"",
    Code: code, DiscountType: type,
    DiscountValue: type==="bogo" ? 0 : Number(document.getElementById("cValue").value),
    MaximumDiscount: document.getElementById("cMaxDiscount").value || "",
    MinimumOrder: Number(document.getElementById("cMinOrder").value)||0,
    UsageLimit: document.getElementById("cUsageLimit").value || "",
    StartDate: document.getElementById("cStartDate").value || "",
    EndDate: document.getElementById("cEndDate").value || "",
    Status: document.getElementById("cStatus").value,
    Description: document.getElementById("cDesc").value.trim()
  };
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!data.success) return alert(data.error||"Failed");
    alert(data.message||"Saved!"); closeCouponModal(); loadCoupons();
  }catch(e){alert("Network error");}
}
function closeCouponModal(){document.getElementById("couponModal").style.display="none";editingCouponId=null;}

function esc(str){return String(str??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
</script>
</body>
</html>

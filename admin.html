<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | URBNVYBE</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#111;min-height:100vh}

  /* Header */
  header{background:#111;color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .logo{font-size:20px;font-weight:800;letter-spacing:2px}
  .header-right{display:flex;align-items:center;gap:15px;font-size:14px}
  .logout-btn{background:#fff;color:#111;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-weight:600}

  /* Login */
  #loginScreen{max-width:400px;margin:100px auto;background:#fff;padding:40px;border-radius:10px;box-shadow:0 5px 25px rgba(0,0,0,.08);text-align:center}
  #loginScreen h1{margin-bottom:10px;font-size:24px}
  #loginScreen p{color:#666;margin-bottom:25px;font-size:14px}
  #loginScreen input{width:100%;padding:14px;border:1px solid #ccc;border-radius:5px;font-size:15px;margin-bottom:15px}
  #loginScreen button{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:5px;font-size:15px;font-weight:700;cursor:pointer}
  .error-msg{color:#c00;font-size:13px;margin-top:10px;display:none}

  /* Main */
  #adminApp{display:none}
  .container{max-width:1300px;margin:0 auto;padding:25px 20px}

  /* Toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:25px;align-items:center}
  .search-box{flex:1;min-width:220px;padding:11px 14px;border:1px solid #ccc;border-radius:5px;font-size:14px}
  select{padding:11px 12px;border:1px solid #ccc;border-radius:5px;font-size:14px;background:#fff}
  .refresh-btn{padding:11px 18px;background:#111;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:600}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:25px}
  .stat-card{background:#fff;padding:18px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.05);text-align:center}
  .stat-card .num{font-size:26px;font-weight:800}
  .stat-card .label{font-size:12px;color:#777;margin-top:4px}

  /* Table */
  .table-wrap{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8f8f8;text-align:left;padding:13px 12px;font-weight:700;border-bottom:1px solid #eee;white-space:nowrap}
  td{padding:12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
  tr:hover{background:#fafafa;cursor:pointer}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
  .badge-new{background:#e3f2fd;color:#1565c0}
  .badge-confirmed{background:#e8f5e9;color:#2e7d32}
  .badge-processing{background:#fff3e0;color:#ef6c00}
  .badge-shipped{background:#f3e5f5;color:#7b1fa2}
  .badge-delivered{background:#e0f2f1;color:#00695c}
  .badge-cancelled{background:#ffebee;color:#c62828}
  .badge-pending{background:#fff8e1;color:#f9a825}
  .badge-paid{background:#e8f5e9;color:#2e7d32}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal{background:#fff;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;border-radius:10px;padding:30px}
  .modal h2{margin-bottom:20px;font-size:22px}
  .modal-section{margin-bottom:22px}
  .modal-section h3{font-size:14px;color:#666;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
  .info-grid div{background:#f9f9f9;padding:10px;border-radius:5px}
  .info-grid strong{display:block;font-size:11px;color:#888;margin-bottom:3px}
  .item-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
  .form-row{margin-bottom:14px}
  .form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .form-row input,.form-row select,.form-row textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;font-size:14px}
  .form-row textarea{min-height:70px;resize:vertical}
  .modal-actions{display:flex;gap:10px;margin-top:25px}
  .btn{padding:12px 20px;border:none;border-radius:5px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:#111;color:#fff}
  .btn-secondary{background:#eee;color:#111}
  .close-btn{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#666}

  .empty{text-align:center;padding:60px 20px;color:#777}
  .loading{text-align:center;padding:40px;color:#666}

  @media(max-width:700px){
    .info-grid{grid-template-columns:1fr}
    .toolbar{flex-direction:column;align-items:stretch}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h1>URBNVYBE Admin</h1>
  <p>Enter password to continue</p>
  <input type="password" id="passwordInput" placeholder="Password" autofocus>
  <button onclick="login()">LOGIN</button>
  <div class="error-msg" id="loginError">Wrong password</div>
</div>

<!-- ADMIN APP -->
<div id="adminApp">
  <header>
    <div class="logo">URBNVYBE Admin</div>
    <div class="header-right">
      <span id="orderCountLabel">0 orders</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <input class="search-box" id="searchInput" placeholder="Search Order ID, Name, Phone..." oninput="filterOrders()">
      <select id="statusFilter" onchange="filterOrders()">
        <option value="">All Order Status</option>
        <option value="New">New</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Processing">Processing</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select id="paymentFilter" onchange="filterOrders()">
        <option value="">All Payment Status</option>
        <option value="Pending">Pending</option>
        <option value="Paid">Paid</option>
        <option value="Failed">Failed</option>
        <option value="Refunded">Refunded</option>
      </select>
      <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <div id="ordersTable">
        <div class="loading">Loading orders...</div>
      </div>
    </div>
  </div>
</div>

<!-- ORDER DETAIL MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <h2 id="modalTitle">Order Details</h2>

    <div id="modalContent"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyo1cxZFeA3uN13nY02kPUITiatINQOJ8KbzGecmVWxXKbhG3cSVfE9OZNTE_C_SyITuQ/exec";
let adminPassword = "";
let allOrders = [];
let currentOrderId = null;

function login() {
  const pass = document.getElementById("passwordInput").value.trim();
  if (!pass) return;

  adminPassword = pass;
  document.getElementById("loginError").style.display = "none";

  // Test password by loading orders
  loadOrders().then(success => {
    if (success) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminApp").style.display = "block";
      localStorage.setItem("urbnvybe_admin_pass", pass);
    } else {
      document.getElementById("loginError").style.display = "block";
      adminPassword = "";
    }
  });
}

function logout() {
  adminPassword = "";
  localStorage.removeItem("urbnvybe_admin_pass");
  document.getElementById("adminApp").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
  document.getElementById("passwordInput").value = "";
}

// Auto login if password saved
window.onload = function() {
  const saved = localStorage.getItem("urbnvybe_admin_pass");
  if (saved) {
    document.getElementById("passwordInput").value = saved;
    login();
  }
};

document.getElementById("passwordInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") login();
});

async function loadOrders() {
  const box = document.getElementById("ordersTable");
  box.innerHTML = '<div class="loading">Loading orders...</div>';

  try {
    const res = await fetch(API_URL + "?action=admin_orders&password=" + encodeURIComponent(adminPassword));
    const data = await res.json();

    if (!data.success) {
      box.innerHTML = '<div class="empty">Error: ' + (data.error || "Failed to load") + '</div>';
      return false;
    }

    allOrders = data.orders || [];
    document.getElementById("orderCountLabel").textContent = allOrders.length + " orders";
    renderStats();
    filterOrders();
    return true;
  } catch (err) {
    box.innerHTML = '<div class="empty">Network error. Please try again.</div>';
    return false;
  }
}

function renderStats() {
  const total = allOrders.length;
  const pending = allOrders.filter(o => (o.OrderStatus || "").toLowerCase() === "new").length;
  const shipped = allOrders.filter(o => (o.OrderStatus || "").toLowerCase() === "shipped").length;
  const delivered = allOrders.filter(o => (o.OrderStatus || "").toLowerCase() === "delivered").length;

  document.getElementById("stats").innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">Total Orders</div></div>
    <div class="stat-card"><div class="num">${pending}</div><div class="label">New / Pending</div></div>
    <div class="stat-card"><div class="num">${shipped}</div><div class="label">Shipped</div></div>
    <div class="stat-card"><div class="num">${delivered}</div><div class="label">Delivered</div></div>
  `;
}

function filterOrders() {
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  const status = document.getElementById("statusFilter").value;
  const payment = document.getElementById("paymentFilter").value;

  let filtered = allOrders.filter(o => {
    const matchSearch = !search ||
      String(o.OrderID || "").toLowerCase().includes(search) ||
      String(o.CustomerName || "").toLowerCase().includes(search) ||
      String(o.Phone || o.Mobile || "").toLowerCase().includes(search);

    const matchStatus = !status || String(o.OrderStatus || "") === status;
    const matchPayment = !payment || String(o.PaymentStatus || "") === payment;

    return matchSearch && matchStatus && matchPayment;
  });

  renderTable(filtered);
}

function renderTable(orders) {
  const box = document.getElementById("ordersTable");

  if (!orders.length) {
    box.innerHTML = '<div class="empty">No orders found</div>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Date</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Total</th>
          <th>Payment</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
  `;

  orders.forEach(o => {
    const date = o.OrderDate ? new Date(o.OrderDate).toLocaleDateString("en-IN") : "-";
    const total = Number(o.Total || 0).toLocaleString("en-IN");
    const statusClass = "badge-" + String(o.OrderStatus || "new").toLowerCase();
    const payClass = "badge-" + String(o.PaymentStatus || "pending").toLowerCase();

    html += `
      <tr onclick="openOrder('${o.OrderID}')">
        <td><strong>${escapeHTML(o.OrderID)}</strong></td>
        <td>${date}</td>
        <td>${escapeHTML(o.CustomerName || "-")}</td>
        <td>${escapeHTML(o.Phone || o.Mobile || "-")}</td>
        <td>₹${total}</td>
        <td><span class="badge ${payClass}">${escapeHTML(o.PaymentStatus || "Pending")}</span></td>
        <td><span class="badge ${statusClass}">${escapeHTML(o.OrderStatus || "New")}</span></td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  box.innerHTML = html;
}

async function openOrder(orderId) {
  currentOrderId = orderId;
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");
  document.getElementById("modalTitle").textContent = "Order " + orderId;
  content.innerHTML = '<div class="loading">Loading details...</div>';
  modal.style.display = "flex";

  try {
    const res = await fetch(API_URL + "?action=admin_order_details&password=" + encodeURIComponent(adminPassword) + "&orderId=" + encodeURIComponent(orderId));
    const data = await res.json();

    if (!data.success) {
      content.innerHTML = '<div class="empty">' + (data.error || "Failed to load") + '</div>';
      return;
    }

    const o = data.order;
    const items = data.items || [];

    let itemsHtml = "";
    items.forEach(item => {
      itemsHtml += `
        <div class="item-row">
          <div>
            <strong>${escapeHTML(item.ProductName || item.productName || "-")}</strong><br>
            <small>${escapeHTML(item.Size || "")} | ${escapeHTML(item.Color || item.ColorCode || "")} | SKU: ${escapeHTML(item.SKU || "")}</small>
          </div>
          <div style="text-align:right">
            Qty: ${item.Quantity || item.quantity || 1}<br>
            ₹${Number(item.Total || item.LineTotal || item.Price || 0).toLocaleString("en-IN")}
          </div>
        </div>
      `;
    });

    content.innerHTML = `
      <div class="modal-section">
        <h3>Customer</h3>
        <div class="info-grid">
          <div><strong>Name</strong>${escapeHTML(o.CustomerName || "-")}</div>
          <div><strong>Phone</strong>${escapeHTML(o.Phone || o.Mobile || "-")}</div>
          <div><strong>Email</strong>${escapeHTML(o.Email || "-")}</div>
          <div><strong>City</strong>${escapeHTML(o.City || "-")}</div>
        </div>
        <div style="margin-top:10px;background:#f9f9f9;padding:10px;border-radius:5px;font-size:14px">
          <strong style="font-size:11px;color:#888">Address</strong><br>
          ${escapeHTML(o.Address || "-")}, ${escapeHTML(o.City || "")}, ${escapeHTML(o.State || "")} - ${escapeHTML(o.Pincode || o.PINCode || "")}
        </div>
      </div>

      <div class="modal-section">
        <h3>Items</h3>
        ${itemsHtml || "<p>No items found</p>"}
      </div>

      <div class="modal-section">
        <h3>Update Order</h3>
        <div class="form-row">
          <label>Order Status</label>
          <select id="editOrderStatus">
            <option value="New">New</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div class="form-row">
          <label>Payment Status</label>
          <select id="editPaymentStatus">
            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
            <option value="Failed">Failed</option>
            <option value="Refunded">Refunded</option>
          </select>
        </div>
        <div class="form-row">
          <label>Tracking Number</label>
          <input type="text" id="editTrackingNumber" value="${escapeHTML(o.TrackingNumber || "")}">
        </div>
        <div class="form-row">
          <label>Tracking URL</label>
          <input type="text" id="editTrackingURL" value="${escapeHTML(o.TrackingURL || "")}">
        </div>
        <div class="form-row">
          <label>Admin Notes</label>
          <textarea id="editNotes">${escapeHTML(o.Notes || "")}</textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" onclick="saveOrder()">Save Changes</button>
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    `;

    // Set current values
    document.getElementById("editOrderStatus").value = o.OrderStatus || "New";
    document.getElementById("editPaymentStatus").value = o.PaymentStatus || "Pending";

  } catch (err) {
    content.innerHTML = '<div class="empty">Failed to load order details</div>';
  }
}

async function saveOrder() {
  const payload = {
    action: "admin_update_order",
    password: adminPassword,
    orderId: currentOrderId,
    orderStatus: document.getElementById("editOrderStatus").value,
    paymentStatus: document.getElementById("editPaymentStatus").value,
    trackingNumber: document.getElementById("editTrackingNumber").value.trim(),
    trackingURL: document.getElementById("editTrackingURL").value.trim(),
    notes: document.getElementById("editNotes").value.trim()
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!data.success) {
      alert(data.error || "Update failed");
      return;
    }

    alert("Order updated successfully!");
    closeModal();
    loadOrders();
  } catch (err) {
    alert("Network error. Please try again.");
  }
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
  currentOrderId = null;
}

function escapeHTML(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>
</body>
</html>

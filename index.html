<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>URBNVYBE | Premium T-Shirts</title>

    <meta name="description"
          content="Shop premium everyday T-shirts from URBNVYBE.">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f6f6f6;
            color: #111;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #111;
            color: white;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow:
                0 2px 10px rgba(0,0,0,.15);
        }

        .nav {
            max-width: 1200px;
            margin: auto;

            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .cart {
            cursor: pointer;
            font-size: 15px;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            background: #111;
            color: white;

            min-height: 420px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 20px;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 78px);
            line-height: 1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .hero p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .shop-btn {
            display: inline-block;

            background: white;
            color: #111;

            padding: 15px 32px;

            border-radius: 4px;

            text-decoration: none;

            font-weight: bold;

            transition: .2s;
        }

        .shop-btn:hover {
            transform: translateY(-2px);
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 60px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: #777;
        }


        /* =========================
           PRODUCTS
        ========================= */

        #products {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(240px, 1fr)
                );

            gap: 25px;
        }

        .product-card {
            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 4px 18px rgba(0,0,0,.07);

            transition:
                transform .2s,
                box-shadow .2s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 30px rgba(0,0,0,.12);
        }


        /* IMAGE */

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;

            background: #eee;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform .3s;
        }

        .product-card:hover
        .product-image img {
            transform: scale(1.04);
        }

        .no-image {
            color: #999;
            font-size: 14px;
        }


        /* PRODUCT INFO */

        .product-info {
            padding: 20px;
        }

        .product-category {
            color: #888;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .product-description {
            color: #666;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 15px;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 18px;
        }

        .price {
            font-size: 20px;
            font-weight: 800;
        }

        .compare-price {
            color: #999;

            text-decoration:
                line-through;

            font-size: 14px;
        }


        /* BUTTONS */

        .product-buttons {
            display: flex;
            gap: 8px;
        }

        .view-btn,
        .cart-btn {

            flex: 1;

            padding: 11px 8px;

            border-radius: 4px;

            cursor: pointer;

            font-weight: 700;

            font-size: 13px;
        }

        .view-btn {
            background: white;
            border: 1px solid #111;
            color: #111;
        }

        .cart-btn {
            background: #111;
            border: 1px solid #111;
            color: white;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;

            grid-column: 1 / -1;

            padding: 50px;

            color: #777;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111;
            color: white;

            margin-top: 40px;

            padding: 50px 20px;

            text-align: center;
        }

        footer h3 {
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        footer p {
            color: #aaa;
            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .nav {
                height: 60px;
            }

            .logo {
                font-size: 20px;
            }

            .nav-link {
                display: none;
            }

            .hero {
                min-height: 350px;
            }

            .hero h1 {
                font-size: 48px;
            }

            .hero p {
                font-size: 15px;
            }

            .container {
                padding:
                    45px 15px;
            }

            #products {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 15px;
            }

            .product-description {
                font-size: 12px;
            }

            .price {
                font-size: 17px;
            }

            .compare-price {
                font-size: 12px;
            }

            .product-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="nav">

        <div class="logo">
            URBNVYBE
        </div>

        <div class="nav-right">

            <a href="#products"
               class="nav-link">
                SHOP
            </a>

            <div class="cart"
                 onclick="showCart()">

                🛒 Cart
                (<span id="cartCount">0</span>)

            </div>

        </div>

    </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <div class="hero-content">

        <h1>
            WEAR YOUR VIBE.
        </h1>

        <p>
            Premium T-shirts designed
            for everyday style.
        </p>

        <a href="#products"
           class="shop-btn">

            SHOP NOW

        </a>

    </div>

</section>


<!-- =========================
     PRODUCTS
========================= -->

<main class="container">

    <div class="section-title">

        <h2>
            Latest Collection
        </h2>

        <p>
            Discover your next favourite T-shirt.
        </p>

    </div>


    <div id="products">

        <div class="loading">

            Loading products...

        </div>

    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <h3>
        URBNVYBE
    </h3>

    <p>
        Premium Everyday Wear
    </p>

    <p style="margin-top:15px;">
        © 2026 URBNVYBE. All rights reserved.
    </p>

</footer>



<script>


/* =========================
   API
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzzW9XtaXrMbm2YS1CFpoBu4tz2h2huBGNwmybtB36OFC3HQ02A7EoXhHZFmf-5O2ohFQ/exec?action=products";


/* =========================
   CART
========================= */

let cart =
    JSON.parse(
        localStorage.getItem("urbnvybe_cart")
    ) || [];


function updateCartCount() {

    const count =
        cart.reduce(
            (total, item) =>
                total + item.quantity,
            0
        );

    document.getElementById(
        "cartCount"
    ).textContent = count;
}


function addToCart(product) {

    const existing =
        cart.find(
            item =>
                item.ProductID ===
                product.ProductID
        );

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            ProductID:
                product.ProductID,

            ProductName:
                product.ProductName,

            Price:
                Number(product.Price) || 0,

            MainImage:
                product.MainImage || "",

            quantity: 1

        });

    }

    localStorage.setItem(
        "urbnvybe_cart",
        JSON.stringify(cart)
    );

    updateCartCount();

    alert(
        product.ProductName +
        " added to cart!"
    );
}


function showCart() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;
    }

    let message =
        "YOUR CART\n\n";

    let total = 0;

    cart.forEach(item => {

        const itemTotal =
            item.Price *
            item.quantity;

        total += itemTotal;

        message +=
            item.ProductName +
            " x " +
            item.quantity +
            " = ₹" +
            itemTotal +
            "\n";

    });

    message +=
        "\nTOTAL: ₹" +
        total;

    alert(message);
}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

    const container =
        document.getElementById(
            "products"
        );

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Unable to load products"
            );

        }


        const products =
            data.products || [];


        /*
         * Only show ACTIVE products
         */

        const activeProducts =
            products.filter(
                product =>
                    String(
                        product.Status || ""
                    ).toLowerCase() ===
                    "active"
            );


        if (
            activeProducts.length === 0
        ) {

            container.innerHTML = `

                <div class="loading">

                    No products available.

                </div>

            `;

            return;

        }


        container.innerHTML = "";


        activeProducts.forEach(
            product => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "product-card";


                const image =
                    product.MainImage;


                const imageHTML =
                    image
                    ?

                    `

                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(
                            product.ProductName
                        )}"
                        loading="lazy"
                    >

                    `

                    :

                    `

                    <div class="no-image">
                        Product Image
                    </div>

                    `;


                card.innerHTML = `

                    <div class="product-image">

                        ${imageHTML}

                    </div>


                    <div class="product-info">


                        <div class="product-category">

                            ${escapeHTML(
                                product.Category || ""
                            )}

                        </div>


                        <div class="product-name">

                            ${escapeHTML(
                                product.ProductName || ""
                            )}

                        </div>


                        <div class="product-description">

                            ${escapeHTML(
                                product.Description || ""
                            )}

                        </div>


                        <div class="price-row">

                            <span class="price">

                                ₹${Number(
                                    product.Price || 0
                                ).toLocaleString("en-IN")}

                            </span>


                            ${
                                product.ComparePrice

                                ?

                                `

                                <span class="compare-price">

                                    ₹${Number(
                                        product.ComparePrice
                                    ).toLocaleString("en-IN")}

                                </span>

                                `

                                : ""

                            }

                        </div>


                        <div class="product-buttons">

                            <button
                                class="view-btn"
                                onclick='viewProduct(${JSON.stringify(
                                    product
                                )})'
                            >

                                VIEW

                            </button>


                            <button
                                class="cart-btn"
                                onclick='addToCart(${JSON.stringify(
                                    product
                                )})'
                            >

                                ADD TO CART

                            </button>

                        </div>


                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="loading">

                <h3>
                    Unable to load products
                </h3>

                <p style="margin-top:10px;">
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =========================
   VIEW PRODUCT
========================= */

function viewProduct(product) {

    alert(

        product.ProductName +
        "\n\n" +

        "Price: ₹" +
        product.Price +
        "\n\n" +

        "Product page will be added next."

    );

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   START
========================= */

updateCartCount();

loadProducts();


</script>

</body>

</html>

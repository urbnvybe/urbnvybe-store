<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>URBNVYBE | Premium T-Shirts</title>
<meta name="description" content="Shop premium everyday T-shirts from URBNVYBE.">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f6f6f6;color:#111}
header{background:#111;color:#fff;position:sticky;top:0;z-index:1000}.nav{max-width:1200px;margin:auto;height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:800;letter-spacing:3px;color:#fff;text-decoration:none}.nav-right{display:flex;align-items:center;gap:25px}
.nav-link,.cart-link{color:#fff;text-decoration:none;font-size:14px;cursor:pointer}
.hero{background:#111;color:#fff;min-height:420px;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px}.hero-content{max-width:750px}
.hero h1{font-size:clamp(42px,7vw,78px);line-height:1;margin-bottom:20px;letter-spacing:-2px}.hero p{font-size:18px;color:#ccc;margin-bottom:30px}
.shop-btn{display:inline-block;background:#fff;color:#111;padding:15px 32px;border-radius:4px;text-decoration:none;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:60px 20px}.section-title{text-align:center;margin-bottom:40px}.section-title h2{font-size:32px;margin-bottom:8px}.section-title p{color:#777}
#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:25px}.product-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.07);transition:.2s}
.product-card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(0,0,0,.12)}.product-image{width:100%;aspect-ratio:1/1;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;transition:.3s}.product-card:hover .product-image img{transform:scale(1.04)}
.product-info{padding:20px}.product-category{color:#888;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.product-name{font-size:18px;font-weight:700;margin-bottom:10px}
.product-description{color:#666;font-size:14px;line-height:1.5;margin-bottom:15px}.price-row{display:flex;align-items:center;gap:10px;margin-bottom:18px}.price{font-size:20px;font-weight:800}.compare-price{color:#999;text-decoration:line-through;font-size:14px}
.product-buttons{display:flex;gap:8px}.view-btn,.cart-btn{flex:1;padding:11px 8px;border-radius:4px;cursor:pointer;font-weight:700;font-size:13px}.view-btn{background:#fff;border:1px solid #111}.cart-btn{background:#111;color:#fff;border:1px solid #111}
.loading{text-align:center;grid-column:1/-1;padding:50px;color:#777}footer{background:#111;color:#fff;margin-top:40px;padding:50px 20px;text-align:center}footer h3{letter-spacing:3px;margin-bottom:10px}footer p{color:#aaa;font-size:14px}
@media(max-width:600px){.nav{height:60px}.logo{font-size:20px}.nav-link{display:none}.hero{min-height:350px}.hero h1{font-size:48px}.hero p{font-size:15px}.container{padding:45px 15px}#products{grid-template-columns:repeat(2,1fr);gap:12px}.product-info{padding:12px}.product-name{font-size:15px}.product-description{font-size:12px}.price{font-size:17px}.compare-price{font-size:12px}.product-buttons{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">URBNVYBE</a><div class="nav-right"><a class="nav-link" href="#products">SHOP</a><a class="cart-link" href="cart.html">🛒 Cart (<span id="cartCount">0</span>)</a></div></div></header>
<section class="hero"><div class="hero-content"><h1>WEAR YOUR VIBE.</h1><p>Premium T-shirts designed for everyday style.</p><a class="shop-btn" href="#products">SHOP NOW</a></div></section>
<main class="container"><div class="section-title"><h2>Latest Collection</h2><p>Discover your next favourite T-shirt.</p></div><div id="products"><div class="loading">Loading products...</div></div></main>
<footer><h3>URBNVYBE</h3><p>Premium Everyday Wear</p><p style="margin-top:15px">© 2026 URBNVYBE. All rights reserved.</p></footer>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbzzW9XtaXrMbm2YS1CFpoBu4tz2h2huBGNwmybtB36OFC3HQ02A7EoXhHZFmf-5O2ohFQ/exec";
let cart=JSON.parse(localStorage.getItem("urbnvybe_cart")||"[]");
function updateCartCount(){document.getElementById("cartCount").textContent=cart.reduce((t,i)=>t+Number(i.quantity||0),0)}
function openProduct(p){location.href="product.html?id="+encodeURIComponent(p.ProductID)}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
async function loadProducts(){
 const box=document.getElementById("products");
 try{
  const r=await fetch(API_URL+"?action=products"); const d=await r.json();
  if(!d.success)throw new Error(d.error||"Unable to load products.");
  const products=(d.products||[]).filter(p=>String(p.Status||"").toLowerCase()==="active");
  if(!products.length){box.innerHTML='<div class="loading">No products available.</div>';return}
  box.innerHTML="";
  products.forEach(p=>{
   const card=document.createElement("div"); card.className="product-card";
   const image=p.MainImage||"";
   card.innerHTML=`<div class="product-image">${image?`<img src="${escapeHTML(image)}" alt="${escapeHTML(p.ProductName)}" loading="lazy">`:'<div class="loading">Product Image</div>'}</div>
   <div class="product-info"><div class="product-category">${escapeHTML(p.Category||"")}</div><div class="product-name">${escapeHTML(p.ProductName||"")}</div>
   <div class="product-description">${escapeHTML(p.Description||"")}</div><div class="price-row"><span class="price">₹${Number(p.Price||0).toLocaleString("en-IN")}</span>${p.ComparePrice?`<span class="compare-price">₹${Number(p.ComparePrice).toLocaleString("en-IN")}</span>`:""}</div>
   <div class="product-buttons"><button class="view-btn">VIEW</button><button class="cart-btn">SELECT SIZE</button></div></div>`;
   card.querySelector(".view-btn").onclick=()=>openProduct(p); card.querySelector(".cart-btn").onclick=()=>openProduct(p); box.appendChild(card);
  });
 }catch(e){box.innerHTML=`<div class="loading"><h3>Unable to load products</h3><p>${escapeHTML(e.message)}</p></div>`}
}
updateCartCount();loadProducts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Your Cart | URBNVYBE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    color: #111;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;
}

.nav {
    max-width: 1200px;
    margin: auto;

    min-height: 70px;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: white;
    text-decoration: none;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: 3px;
}

.nav-right {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-right a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

/* =========================
   PAGE
========================= */

.container {
    max-width: 1200px;

    margin: 50px auto;

    padding: 0 20px;
}

.page-title {
    font-size: 34px;

    margin-bottom: 30px;
}

/* =========================
   LAYOUT
========================= */

.cart-layout {
    display: grid;

    grid-template-columns:
        1fr 360px;

    gap: 30px;

    align-items: start;
}

/* =========================
   CART ITEMS
========================= */

.cart-items {
    display: flex;

    flex-direction: column;

    gap: 15px;
}

.cart-item {
    background: white;

    border-radius: 8px;

    padding: 18px;

    display: grid;

    grid-template-columns:
        110px 1fr auto;

    gap: 20px;

    align-items: center;

    box-shadow:
        0 3px 15px rgba(0,0,0,.05);
}

.cart-image {
    width: 110px;
    height: 110px;

    background: #f3f3f3;

    border-radius: 6px;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;
}

.cart-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.item-name {
    font-size: 18px;

    font-weight: 700;

    margin-bottom: 8px;
}

.item-info {
    color: #666;

    font-size: 14px;

    line-height: 1.7;
}

.item-price {
    margin-top: 8px;

    font-weight: 700;

    font-size: 17px;
}

/* =========================
   QUANTITY
========================= */

.quantity-control {
    display: flex;

    align-items: center;

    border: 1px solid #ccc;

    width: fit-content;

    margin-top: 12px;

    border-radius: 4px;

    overflow: hidden;
}

.quantity-control button {
    width: 36px;
    height: 36px;

    border: 0;

    background: white;

    font-size: 18px;

    cursor: pointer;
}

.quantity-control button:hover {
    background: #eee;
}

.quantity-control button:disabled {
    color: #aaa;

    cursor: not-allowed;

    background: #f5f5f5;
}

.quantity-control span {
    width: 40px;

    text-align: center;

    font-weight: 700;
}

.item-right {
    text-align: right;

    min-width: 110px;
}

.item-total {
    font-size: 18px;

    font-weight: 800;

    margin-bottom: 15px;
}

.remove-button {
    border: 0;

    background: transparent;

    color: #777;

    cursor: pointer;

    text-decoration: underline;

    font-size: 13px;
}

.remove-button:hover {
    color: #111;
}

/* =========================
   SUMMARY
========================= */

.summary {
    background: white;

    border-radius: 8px;

    padding: 25px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.05);

    position: sticky;

    top: 20px;
}

.summary h2 {
    font-size: 22px;

    margin-bottom: 25px;
}

.summary-row {
    display: flex;

    justify-content: space-between;

    margin-bottom: 15px;

    color: #555;
}

.summary-row.total {
    border-top: 1px solid #ddd;

    padding-top: 18px;

    margin-top: 18px;

    color: #111;

    font-size: 20px;

    font-weight: 800;
}

.free {
    font-weight: 700;

    color: #111;
}

/* =========================
   BUTTONS
========================= */

.checkout-button {
    width: 100%;

    padding: 15px;

    margin-top: 20px;

    background: #111;

    color: white;

    border: 1px solid #111;

    border-radius: 4px;

    font-weight: 700;

    cursor: pointer;

    font-size: 15px;
}

.checkout-button:hover {
    opacity: .85;
}

.continue-button {
    width: 100%;

    padding: 14px;

    margin-top: 10px;

    background: white;

    color: #111;

    border: 1px solid #111;

    border-radius: 4px;

    font-weight: 700;

    cursor: pointer;

    font-size: 14px;
}

/* =========================
   EMPTY CART
========================= */

.empty-cart {
    background: white;

    padding: 70px 30px;

    text-align: center;

    border-radius: 8px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.05);
}

.empty-cart h2 {
    margin-bottom: 15px;
}

.empty-cart p {
    color: #666;

    margin-bottom: 25px;
}

.empty-cart a {
    display: inline-block;

    padding: 13px 25px;

    background: #111;

    color: white;

    text-decoration: none;

    border-radius: 4px;

    font-weight: 700;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .cart-layout {
        grid-template-columns: 1fr;
    }

    .summary {
        position: static;
    }

    .cart-item {
        grid-template-columns:
            85px 1fr;

        gap: 15px;
    }

    .cart-image {
        width: 85px;
        height: 85px;
    }

    .item-right {
        grid-column: 2;

        text-align: left;
    }

    .item-total {
        margin-bottom: 8px;
    }

}

</style>

</head>


<body>


<header>

<div class="nav">

<a href="index.html"
   class="logo">

URBNVYBE

</a>

<div class="nav-right">

<a href="index.html">
SHOP
</a>

<span>
🛒 Cart
</span>

</div>

</div>

</header>


<main class="container">

<h1 class="page-title">
Your Cart
</h1>


<div id="cartPage">

</div>

</main>


<script>

/* =========================
   CART STORAGE
========================= */

let cart =
JSON.parse(
    localStorage.getItem(
        "urbnvybe_cart"
    )
) || [];


/* =========================
   SAVE CART
========================= */

function saveCart() {

    localStorage.setItem(
        "urbnvybe_cart",
        JSON.stringify(cart)
    );

}


/* =========================
   RENDER CART
========================= */

function renderCart() {

    const page =
        document.getElementById(
            "cartPage"
        );


    if (cart.length === 0) {

        page.innerHTML = `

            <div class="empty-cart">

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Looks like you haven't
                    added anything yet.
                </p>

                <a href="index.html">
                    CONTINUE SHOPPING
                </a>

            </div>

        `;

        return;

    }


    let subtotal = 0;


    cart.forEach(
        item => {

            subtotal +=
                Number(
                    item.Price || 0
                ) *
                Number(
                    item.quantity || 0
                );

        }
    );


    const shipping = 0;

    const total =
        subtotal +
        shipping;


    page.innerHTML = `

        <div class="cart-layout">


            <!-- ITEMS -->

            <div class="cart-items">

                ${cart.map(
                    (item, index) =>
                        createCartItem(
                            item,
                            index
                        )
                ).join("")}

            </div>


            <!-- SUMMARY -->

            <div class="summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₹${formatMoney(
                            subtotal
                        )}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <span class="free">
                        FREE
                    </span>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹${formatMoney(
                            total
                        )}
                    </span>

                </div>


                <button
                    class="checkout-button"
                    onclick="proceedToCheckout()"
                >

                    PROCEED TO CHECKOUT

                </button>


                <button
                    class="continue-button"
                    onclick="continueShopping()"
                >

                    CONTINUE SHOPPING

                </button>

            </div>

        </div>

    `;

}


/* =========================
   CREATE ITEM
========================= */

function createCartItem(
    item,
    index
) {

    const price =
        Number(
            item.Price || 0
        );


    const quantity =
        Number(
            item.quantity || 0
        );


    const stock =
        Number(
            item.Stock || 0
        );


    const itemTotal =
        price *
        quantity;


    return `

        <div class="cart-item">


            <div class="cart-image">

                ${
                    item.Image

                    ?

                    `

                    <img
                        src="${escapeHTML(
                            item.Image
                        )}"
                        alt="${escapeHTML(
                            item.ProductName
                        )}"
                    >

                    `

                    :

                    `<span>
                        No Image
                    </span>`

                }

            </div>


            <div>

                <div class="item-name">

                    ${escapeHTML(
                        item.ProductName
                    )}

                </div>


                <div class="item-info">

                    Colour:
                    ${escapeHTML(
                        item.Color ||
                        item.ColorCode ||
                        "-"
                    )}

                    <br>

                    Size:
                    ${escapeHTML(
                        item.Size ||
                        "-"
                    )}

                    <br>

                    SKU:
                    ${escapeHTML(
                        item.SKU ||
                        "-"
                    )}

                </div>


                <div class="item-price">

                    ₹${formatMoney(
                        price
                    )}

                </div>


                <div class="quantity-control">

                    <button
                        onclick="decreaseItem(
                            ${index}
                        )"
                        ${
                            quantity <= 1
                            ? "disabled"
                            : ""
                        }
                    >
                        −
                    </button>


                    <span>
                        ${quantity}
                    </span>


                    <button
                        onclick="increaseItem(
                            ${index}
                        )"
                        ${
                            quantity >= stock
                            ? "disabled"
                            : ""
                        }
                    >
                        +
                    </button>

                </div>

            </div>


            <div class="item-right">

                <div class="item-total">

                    ₹${formatMoney(
                        itemTotal
                    )}

                </div>


                <button
                    class="remove-button"
                    onclick="removeItem(
                        ${index}
                    )"
                >

                    Remove

                </button>

            </div>


        </div>

    `;

}


/* =========================
   INCREASE
========================= */

function increaseItem(index) {

    const item =
        cart[index];


    if (!item) return;


    const stock =
        Number(
            item.Stock || 0
        );


    const quantity =
        Number(
            item.quantity || 0
        );


    if (
        quantity <
        stock
    ) {

        item.quantity =
            quantity + 1;

    }


    saveCart();

    renderCart();

}


/* =========================
   DECREASE
========================= */

function decreaseItem(index) {

    const item =
        cart[index];


    if (!item) return;


    const quantity =
        Number(
            item.quantity || 0
        );


    if (
        quantity > 1
    ) {

        item.quantity =
            quantity - 1;

    }


    saveCart();

    renderCart();

}


/* =========================
   REMOVE
========================= */

function removeItem(index) {

    const item =
        cart[index];


    if (!item) return;


    cart.splice(
        index,
        1
    );


    saveCart();

    renderCart();

}


/* =========================
   CHECKOUT
========================= */

function proceedToCheckout() {

    window.location.href =
        "checkout.html";

}


/* =========================
   CONTINUE SHOPPING
========================= */

function continueShopping() {

    window.location.href =
        "index.html";

}


/* =========================
   MONEY
========================= */

function formatMoney(value) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-IN"
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   START
========================= */

renderCart();

</script>


</body>

</html>

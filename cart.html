<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | URBNVYBE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f7f7;color:#111}
header{background:#111;color:#fff}
.nav{max-width:1200px;margin:auto;min-height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.logo{color:#fff;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:3px}
.nav-right a{color:#fff;text-decoration:none;font-size:14px}
.container{max-width:1200px;margin:50px auto;padding:0 20px}
.page-title{font-size:34px;margin-bottom:30px}
.cart-layout{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:start}
.cart-items{display:flex;flex-direction:column;gap:15px}
.cart-item{background:#fff;border-radius:8px;padding:18px;display:grid;grid-template-columns:110px 1fr auto;gap:20px;align-items:center;box-shadow:0 3px 15px rgba(0,0,0,.05)}
.cart-image{width:110px;height:110px;background:#f3f3f3;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cart-image img{width:100%;height:100%;object-fit:contain}
.item-name{font-size:18px;font-weight:700;margin-bottom:8px}
.item-info{color:#666;font-size:14px;line-height:1.7}
.item-price{margin-top:8px;font-weight:700;font-size:17px}
.quantity-control{display:flex;align-items:center;border:1px solid #ccc;width:fit-content;margin-top:12px;border-radius:4px;overflow:hidden}
.quantity-control button{width:36px;height:36px;border:0;background:#fff;font-size:18px;cursor:pointer}
.quantity-control button:disabled{color:#aaa;cursor:not-allowed;background:#f5f5f5}
.quantity-control span{width:40px;text-align:center;font-weight:700}
.item-right{text-align:right;min-width:110px}
.item-total{font-size:18px;font-weight:800;margin-bottom:15px}
.remove-button{border:0;background:transparent;color:#777;cursor:pointer;text-decoration:underline;font-size:13px}
.summary{background:#fff;border-radius:8px;padding:25px;box-shadow:0 3px 15px rgba(0,0,0,.05);position:sticky;top:20px}
.summary h2{font-size:22px;margin-bottom:25px}
.summary-row{display:flex;justify-content:space-between;margin-bottom:15px;color:#555}
.summary-row.total{border-top:1px solid #ddd;padding-top:18px;margin-top:18px;color:#111;font-size:20px;font-weight:800}
.checkout-button,.continue-button{width:100%;padding:15px;margin-top:15px;border-radius:4px;font-weight:700;cursor:pointer;font-size:15px}
.checkout-button{background:#111;color:#fff;border:1px solid #111}
.continue-button{background:#fff;color:#111;border:1px solid #111}
.empty-cart{background:#fff;padding:70px 30px;text-align:center;border-radius:8px;box-shadow:0 3px 15px rgba(0,0,0,.05)}
.empty-cart a{display:inline-block;padding:13px 25px;background:#111;color:#fff;text-decoration:none;border-radius:4px;font-weight:700;margin-top:20px}
@media(max-width:800px){
  .cart-layout{grid-template-columns:1fr}
  .summary{position:static}
  .cart-item{grid-template-columns:85px 1fr;gap:15px}
  .cart-image{width:85px;height:85px}
  .item-right{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="index.html" class="logo">URBNVYBE</a>
    <div class="nav-right"><a href="index.html">SHOP</a></div>
  </div>
</header>

<main class="container">
  <h1 class="page-title">Your Cart</h1>
  <div id="cartPage"></div>
</main>

<script>
let cart = JSON.parse(localStorage.getItem("urbnvybe_cart") || "[]");

function saveCart() {
  localStorage.setItem("urbnvybe_cart", JSON.stringify(cart));
}

function formatMoney(v) {
  return Number(v || 0).toLocaleString("en-IN");
}

function escapeHTML(v) {
  return String(v || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function renderCart() {
  const page = document.getElementById("cartPage");

  if (!cart.length) {
    page.innerHTML = `
      <div class="empty-cart">
        <h2>Your cart is empty</h2>
        <p>Looks like you haven't added anything yet.</p>
        <a href="index.html">CONTINUE SHOPPING</a>
      </div>`;
    return;
  }

  let subtotal = 0;
  cart.forEach(item => subtotal += Number(item.Price || 0) * Number(item.quantity || 0));

  page.innerHTML = `
    <div class="cart-layout">
      <div class="cart-items">
        ${cart.map((item, index) => createCartItem(item, index)).join("")}
      </div>
      <div class="summary">
        <h2>Order Summary</h2>
        <div class="summary-row"><span>Subtotal</span><strong>₹${formatMoney(subtotal)}</strong></div>
        <div class="summary-row"><span>Shipping</span><strong>FREE</strong></div>
        <div class="summary-row total"><span>Total</span><span>₹${formatMoney(subtotal)}</span></div>
        <button class="checkout-button" onclick="location.href='checkout.html'">PROCEED TO CHECKOUT</button>
        <button class="continue-button" onclick="location.href='index.html'">CONTINUE SHOPPING</button>
      </div>
    </div>`;
}

function createCartItem(item, index) {
  const price = Number(item.Price || 0);
  const qty = Number(item.quantity || 0);
  const stock = Number(item.Stock || 0);
  const total = price * qty;

  return `
    <div class="cart-item">
      <div class="cart-image">
        ${item.Image ? `<img src="${escapeHTML(item.Image)}" alt="${escapeHTML(item.ProductName)}">` : "<span>No Image</span>"}
      </div>
      <div>
        <div class="item-name">${escapeHTML(item.ProductName)}</div>
        <div class="item-info">
          Colour: ${escapeHTML(item.ColorCode || "-")}<br>
          Size: ${escapeHTML(item.Size || "-")}<br>
          SKU: ${escapeHTML(item.SKU || "-")}
        </div>
        <div class="item-price">₹${formatMoney(price)}</div>
        <div class="quantity-control">
          <button onclick="decreaseItem(${index})" ${qty <= 1 ? "disabled" : ""}>−</button>
          <span>${qty}</span>
          <button onclick="increaseItem(${index})" ${qty >= stock ? "disabled" : ""}>+</button>
        </div>
      </div>
      <div class="item-right">
        <div class="item-total">₹${formatMoney(total)}</div>
        <button class="remove-button" onclick="removeItem(${index})">Remove</button>
      </div>
    </div>`;
}

function increaseItem(i) {
  const item = cart[i];
  if (!item) return;
  if (Number(item.quantity) < Number(item.Stock || 0)) {
    item.quantity = Number(item.quantity) + 1;
    saveCart();
    renderCart();
  }
}

function decreaseItem(i) {
  const item = cart[i];
  if (!item) return;
  if (Number(item.quantity) > 1) {
    item.quantity = Number(item.quantity) - 1;
    saveCart();
    renderCart();
  }
}

function removeItem(i) {
  cart.splice(i, 1);
  saveCart();
  renderCart();
}

renderCart();
</script>
</body>
</html>

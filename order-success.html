<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order confirmed | URBNVYBE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f4ef;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    header {
      background: #111;
      color: #fff
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #fff;
      text-decoration: none
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px
    }

    .card {
      background: #fffcf8;
      border: 1px solid #e8e2d9;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center
    }

    .badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #111;
      color: #f7f4ef;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px
    }

    p {
      color: #5c574f;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px
    }

    .oid {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .5px;
      margin: 16px 0;
      padding: 12px;
      background: #eef2f6;
      border-radius: 8px
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px
    }

    .btn {
      display: block;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px
    }

    .btn-primary {
      background: #111;
      color: #f7f4ef
    }

    .btn-outline {
      border: 1px solid #111;
      color: #111;
      background: #fff
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner"><a class="logo" href="index.html">URBNVYBE</a></div>
  </header>
  <main>
    <div class="card">
      <div class="badge">✓</div>
      <h1>Order confirmed</h1>
      <p>Thanks for shopping URBNVYBE. Save your Order ID to track shipping.</p>
      <div class="oid" id="oid">—</div>
      <div class="actions">
        <a class="btn btn-primary" id="trackLink" href="track.html">TRACK THIS ORDER</a>
        <a class="btn btn-outline" href="index.html">CONTINUE SHOPPING</a>
      </div>
    </div>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get("orderId") || "";
    document.getElementById("oid").textContent = id || "Check your confirmation email";
    if (id) {
      document.getElementById("trackLink").href = "track.html?orderId=" + encodeURIComponent(id);
    }
  </script>
</body>

</html>

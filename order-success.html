<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Confirmed | URBNVYBE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f7;color:#111}
header{background:#111;color:#fff}
.nav{max-width:1100px;margin:auto;min-height:70px;padding:0 20px;display:flex;align-items:center}
.logo{color:#fff;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:3px}
main{max-width:700px;margin:70px auto;padding:0 20px}
.box{background:#fff;padding:45px 30px;border-radius:10px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.check{font-size:55px;margin-bottom:15px}
h1{margin-bottom:12px}
.order{font-size:20px;font-weight:800;margin:20px 0}
.message{color:#666;line-height:1.6}
.btn{display:inline-block;margin-top:25px;padding:14px 28px;background:#111;color:#fff;text-decoration:none;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="nav"><a class="logo" href="index.html">URBNVYBE</a></div>
</header>
<main>
  <div class="box">
    <div class="check">✓</div>
    <h1>Thank You For Your Order!</h1>
    <p class="order" id="orderId"></p>
    <p class="message">Your order has been received successfully. We have recorded your order details and will process it shortly.</p>
    <a class="btn" href="index.html">CONTINUE SHOPPING</a>
  </div>
</main>
<script>
const p = new URLSearchParams(location.search);
const id = p.get("orderId") || "";
document.getElementById("orderId").textContent = id ? "Order ID: " + id : "Order placed successfully";
</script>
</body>
</html>

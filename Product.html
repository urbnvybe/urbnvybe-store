<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Product | URBNVYBE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    color: #111;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;

    position: sticky;
    top: 0;
    z-index: 100;
}

.nav {
    max-width: 1200px;
    margin: auto;

    height: 70px;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: white;
    text-decoration: none;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: 3px;
}

.nav-right {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-right a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.cart {
    cursor: pointer;
}

/* =========================
   PRODUCT
========================= */

.product-container {
    max-width: 1200px;

    margin: 50px auto;

    padding: 0 20px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 60px;
}

/* =========================
   GALLERY
========================= */

.gallery {
    background: white;

    border-radius: 10px;

    padding: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.main-image {
    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f3f3f3;

    border-radius: 8px;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.thumbnail-container {
    display: flex;

    gap: 10px;

    margin-top: 15px;

    overflow-x: auto;
}

.thumbnail {
    width: 75px;
    height: 75px;

    flex-shrink: 0;

    border: 2px solid transparent;

    border-radius: 5px;

    overflow: hidden;

    cursor: pointer;

    background: #eee;
}

.thumbnail.active {
    border-color: #111;
}

.thumbnail img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================
   PRODUCT INFO
========================= */

.product-info {
    padding-top: 10px;
}

.category {
    color: #777;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 12px;
}

.product-title {
    font-size: 38px;

    line-height: 1.1;

    margin-bottom: 15px;
}

.description {
    color: #555;

    line-height: 1.7;

    margin: 20px 0;
}

/* =========================
   PRICE
========================= */

.price-row {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 20px 0;
}

.price {
    font-size: 30px;

    font-weight: 800;
}

.compare-price {
    color: #999;

    text-decoration: line-through;

    font-size: 18px;
}

/* =========================
   OPTIONS
========================= */

.option {
    margin: 25px 0;
}

.option-title {
    font-weight: 700;

    margin-bottom: 10px;
}

.size-buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.size-button {
    min-width: 50px;

    padding: 11px 15px;

    background: white;

    border: 1px solid #ccc;

    cursor: pointer;

    border-radius: 4px;

    font-weight: 600;
}

.size-button:hover:not(:disabled) {
    border-color: #111;
}

.size-button.selected {
    background: #111;
    color: white;

    border-color: #111;
}

.size-button:disabled {
    background: #eee;

    color: #999;

    border-color: #ddd;

    cursor: not-allowed;

    text-decoration: line-through;
}

.stock-message {
    margin-top: 10px;

    font-size: 13px;

    color: #555;
}

/* =========================
   QUANTITY
========================= */

.quantity-box {
    display: flex;

    align-items: center;

    width: fit-content;

    border: 1px solid #ccc;

    background: white;

    border-radius: 4px;

    overflow: hidden;
}

.quantity-box button {
    width: 42px;

    height: 42px;

    border: 0;

    background: white;

    font-size: 20px;

    cursor: pointer;
}

.quantity-box button:disabled {
    color: #aaa;

    cursor: not-allowed;
}

.quantity-box span {
    width: 45px;

    text-align: center;

    font-weight: bold;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;

    gap: 10px;

    margin-top: 25px;
}

.add-cart,
.buy-now {
    flex: 1;

    padding: 15px;

    border-radius: 4px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;
}

.add-cart {
    background: white;

    color: #111;

    border: 1px solid #111;
}

.buy-now {
    background: #111;

    color: white;

    border: 1px solid #111;
}

.add-cart:disabled,
.buy-now:disabled {
    opacity: .5;

    cursor: not-allowed;
}

/* =========================
   DETAILS
========================= */

.details {
    max-width: 1200px;

    margin: 0 auto 60px;

    padding: 0 20px;
}

.detail-box {
    background: white;

    padding: 30px;

    border-radius: 10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.05);
}

.detail-box h2 {
    margin-bottom: 15px;
}

.detail-box p {
    color: #555;

    line-height: 1.7;
}

/* =========================
   LOADING
========================= */

.message {
    text-align: center;

    padding: 100px 20px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .product-container {
        grid-template-columns: 1fr;

        gap: 30px;
    }

    .product-title {
        font-size: 30px;
    }

    .product-info {
        padding-top: 0;
    }

    .actions {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<header>

<div class="nav">

<a href="index.html"
   class="logo">

URBNVYBE

</a>

<div class="nav-right">

<a href="index.html">
SHOP
</a>

<div class="cart"
     onclick="showCart()">

🛒 Cart
(<span id="cartCount">0</span>)

</div>

</div>

</div>

</header>


<div id="page">

<div class="message">

Loading product...

</div>

</div>


<script>
/* =========================================================
   URBNVYBE PRODUCT PAGE - COMPLETE FIXED VERSION
   This version keeps the existing design but makes variant
   / size loading tolerant of different Google Apps Script
   JSON property casing and formats.
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzzW9XtaXrMbm2YS1CFpoBu4tz2h2huBGNwmybtB36OFC3HQ02A7EoXhHZFmf-5O2ohFQ/exec?action=products";

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

let cart = JSON.parse(localStorage.getItem("urbnvybe_cart") || "[]");
let currentProduct = null;
let variants = [];
let selectedVariant = null;
let quantity = 1;

/* ---------- Small helpers ---------- */

function getValue(obj, names, fallback = "") {
    if (!obj || typeof obj !== "object") return fallback;

    for (const name of names) {
        if (Object.prototype.hasOwnProperty.call(obj, name) &&
            obj[name] !== null &&
            obj[name] !== undefined) {
            return obj[name];
        }
    }

    return fallback;
}

function toArray(value) {
    if (Array.isArray(value)) return value;

    if (value && typeof value === "object") {
        /* Sometimes an API returns an object keyed by VariantID. */
        return Object.values(value);
    }

    if (typeof value === "string") {
        const s = value.trim();

        if (!s) return [];

        try {
            const parsed = JSON.parse(s);
            return toArray(parsed);
        } catch (e) {
            return [];
        }
    }

    return [];
}

function normalizeVariants(product) {
    if (!product || typeof product !== "object") return [];

    /* Support the common names used by Apps Script / Sheets APIs. */
    const possible = [
        product.variants,
        product.Variants,
        product.variant,
        product.Variant,
        product.variantList,
        product.VariantList
    ];

    for (const value of possible) {
        const arr = toArray(value);

        if (arr.length) {
            return arr.map((v, index) => ({
                VariantID: String(getValue(
                    v,
                    ["VariantID", "variantID", "variantId", "VariantId"],
                    "VAR-" + (index + 1)
                )).trim(),

                ProductID: String(getValue(
                    v,
                    ["ProductID", "productID", "productId", "ProductId"],
                    product.ProductID || product.productID || ""
                )).trim(),

                SKU: String(getValue(
                    v,
                    ["SKU", "sku"],
                    ""
                )).trim(),

                ColorCode: String(getValue(
                    v,
                    ["ColorCode", "colorCode", "Color", "color"],
                    product.Color || product.ColorCode || ""
                )).trim(),

                Size: String(getValue(
                    v,
                    ["Size", "size"],
                    ""
                )).trim(),

                Price: Number(getValue(
                    v,
                    ["Price", "price"],
                    product.Price || 0
                )) || 0,

                ComparePrice: Number(getValue(
                    v,
                    ["ComparePrice", "comparePrice"],
                    product.ComparePrice || 0
                )) || 0,

                Stock: Number(getValue(
                    v,
                    ["Stock", "stock", "Qty", "qty", "Quantity", "quantity"],
                    0
                )) || 0,

                Status: String(getValue(
                    v,
                    ["Status", "status"],
                    "Active"
                )).trim(),

                Image: String(getValue(
                    v,
                    ["Image", "image"],
                    product.MainImage || ""
                )).trim()
            }));
        }
    }

    return [];
}

function isActiveVariant(v) {
    const status = String(v.Status || "").trim().toLowerCase();

    /*
      Blank status is accepted because some Sheets rows do not
      have a status value. Stock still controls availability.
    */
    return status === "" ||
           status === "active" ||
           status === "available" ||
           status === "enabled" ||
           status === "true" ||
           status === "1";
}

/* ---------- Cart count ---------- */

function updateCartCount() {
    const count = cart.reduce(
        (total, item) => total + Number(item.quantity || 0),
        0
    );

    const el = document.getElementById("cartCount");
    if (el) el.textContent = count;
}

/* ---------- Load product ---------- */

async function loadProduct() {
    const page = document.getElementById("page");

    if (!productId) {
        showError("Product ID is missing.");
        return;
    }

    try {
        const response = await fetch(
            API_URL + "&_=" + Date.now(),
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "API request failed (" + response.status + ")."
            );
        }

        const data = await response.json();

        if (!data || data.success === false) {
            throw new Error(
                data && data.error
                    ? data.error
                    : "Unable to load products."
            );
        }

        const productList = toArray(
            data.products ||
            data.Products ||
            data.data ||
            data.items
        );

        const product = productList.find(item => {
            const id = getValue(
                item,
                ["ProductID", "productID", "productId", "ProductId"],
                ""
            );

            return String(id).trim() === String(productId).trim();
        });

        if (!product) {
            throw new Error("Product not found.");
        }

        currentProduct = product;

        variants = normalizeVariants(product)
            .filter(isActiveVariant)
            .filter(v => v.Size !== "");

        document.title =
            String(
                getValue(
                    product,
                    ["ProductName", "productName", "name"],
                    "Product"
                )
            ) + " | URBNVYBE";

        renderProduct(product);

    } catch (error) {
        console.error("URBNVYBE PRODUCT ERROR:", error);
        showError(error.message || "Unable to load product.");
    }
}

/* ---------- Error ---------- */

function showError(message) {
    document.getElementById("page").innerHTML = `
        <div class="message">
            <h2>Unable to load product</h2>
            <p style="margin-top:15px;">${escapeHTML(message)}</p>
            <p style="margin-top:20px;">
                <a href="index.html">Back to Shop</a>
            </p>
        </div>
    `;
}

/* ---------- Render product ---------- */

function renderProduct(product) {
    const page = document.getElementById("page");

    const productName = String(getValue(
        product,
        ["ProductName", "productName", "name"],
        ""
    ));

    const category = String(getValue(
        product,
        ["Category", "category"],
        ""
    ));

    const description = String(getValue(
        product,
        ["Description", "description"],
        ""
    ));

    const price = Number(getValue(
        product,
        ["Price", "price"],
        0
    )) || 0;

    const comparePrice = Number(getValue(
        product,
        ["ComparePrice", "comparePrice"],
        0
    )) || 0;

    const color = String(getValue(
        product,
        ["Color", "color", "ColorCode", "colorCode"],
        "Navy Blue"
    ));

    const mainImage = String(getValue(
        product,
        ["MainImage", "mainImage", "Image", "image"],
        ""
    ));

    const images = [
        getValue(product, ["MainImage", "mainImage"], ""),
        getValue(product, ["BackImage", "backImage"], ""),
        getValue(product, ["SideImage", "sideImage"], ""),
        getValue(product, ["SleeveImage", "sleeveImage"], ""),
        getValue(product, ["CollarImage", "collarImage"], ""),
        getValue(product, ["ModelImage", "modelImage"], "")
    ]
    .map(x => String(x || "").trim())
    .filter(Boolean);

    if (!images.length) images.push("");

    const material = String(getValue(
        product,
        ["Material", "material"],
        ""
    ));

    const gender = String(getValue(
        product,
        ["Gender", "gender"],
        ""
    ));

    page.innerHTML = `
        <div class="product-container">

            <div class="gallery">

                <div class="main-image">

                    ${
                        images[0]
                        ?
                        `
                        <img
                            id="mainProductImage"
                            src="${escapeHTML(images[0])}"
                            alt="${escapeHTML(productName)}"
                        >
                        `
                        :
                        `
                        <span>Product Image</span>
                        `
                    }

                </div>

                <div class="thumbnail-container">

                    ${
                        images.map((image, index) =>
                            image
                            ?
                            `
                            <div
                                class="thumbnail ${index === 0 ? "active" : ""}"
                                onclick="changeImage('${escapeJS(image)}', this)"
                            >
                                <img
                                    src="${escapeHTML(image)}"
                                    alt="Product view"
                                >
                            </div>
                            `
                            :
                            ""
                        ).join("")
                    }

                </div>

            </div>

            <div class="product-info">

                <div class="category">
                    ${escapeHTML(category)}
                </div>

                <h1 class="product-title">
                    ${escapeHTML(productName)}
                </h1>

                <div class="price-row">

                    <span class="price" id="productPrice">
                        ₹${formatMoney(price)}
                    </span>

                    <span class="compare-price" id="comparePrice">
                        ${
                            comparePrice > 0
                            ? "₹" + formatMoney(comparePrice)
                            : ""
                        }
                    </span>

                </div>

                <div class="description">
                    ${escapeHTML(description)}
                </div>

                <div class="option">

                    <div class="option-title">
                        Colour
                    </div>

                    <div class="color-value">
                        ${escapeHTML(color)}
                    </div>

                </div>

                <div class="option">

                    <div class="option-title">
                        Size
                    </div>

                    <div
                        id="sizeButtons"
                        class="size-buttons"
                    ></div>

                    <div
                        id="stockMessage"
                        class="stock-message"
                    >
                        Select a size.
                    </div>

                </div>

                <div class="option">

                    <div class="option-title">
                        Quantity
                    </div>

                    <div class="quantity-box">

                        <button
                            id="minusButton"
                            onclick="decreaseQuantity()"
                        >−</button>

                        <span id="quantity">1</span>

                        <button
                            id="plusButton"
                            onclick="increaseQuantity()"
                        >+</button>

                    </div>

                </div>

                <div class="actions">

                    <button
                        id="addCartButton"
                        class="add-cart"
                        onclick="handleAddToCart()"
                        disabled
                    >
                        SELECT SIZE
                    </button>

                    <button
                        id="buyNowButton"
                        class="buy-now"
                        onclick="handleBuyNow()"
                        disabled
                    >
                        SELECT SIZE
                    </button>

                </div>

            </div>

        </div>

        <div class="details">

            <div class="detail-box">

                <h2>Product Details</h2>

                <p>
                    ${escapeHTML(
                        description ||
                        "Premium quality product designed for everyday comfort and style."
                    )}
                </p>

                ${
                    material
                    ?
                    `
                    <p style="margin-top:15px;">
                        <strong>Material:</strong>
                        ${escapeHTML(material)}
                    </p>
                    `
                    :
                    ""
                }

                ${
                    gender
                    ?
                    `
                    <p>
                        <strong>Gender:</strong>
                        ${escapeHTML(gender)}
                    </p>
                    `
                    :
                    ""
                }

            </div>

        </div>
    `;

    renderVariants();
}

/* ---------- Render sizes ---------- */

function renderVariants() {
    const container = document.getElementById("sizeButtons");
    const message = document.getElementById("stockMessage");

    if (!container) return;

    container.innerHTML = "";

    if (!variants.length) {
        container.innerHTML = `
            <span>No sizes available.</span>
        `;

        if (message) {
            message.textContent =
                "No active size variants were returned by the store API.";
        }

        return;
    }

    /*
      Preserve the size order from Google Sheets.
      Duplicate sizes are shown only once.
    */
    const uniqueSizes = [];

    variants.forEach(variant => {
        const size = String(variant.Size || "").trim();

        if (size && !uniqueSizes.includes(size)) {
            uniqueSizes.push(size);
        }
    });

    uniqueSizes.forEach(size => {

        const sizeVariants = variants.filter(
            variant =>
                String(variant.Size || "").trim() === size
        );

        const variant =
            sizeVariants.find(
                item => Number(item.Stock || 0) > 0
            ) ||
            sizeVariants[0];

        const stock = Number(variant.Stock || 0);

        const button = document.createElement("button");

        button.type = "button";
        button.className = "size-button";
        button.textContent = size;
        button.dataset.size = size;

        if (stock <= 0) {

            button.disabled = true;
            button.title = "Out of stock";

        } else {

            button.addEventListener("click", function() {
                selectVariant(variant);
            });

        }

        container.appendChild(button);
    });

    if (uniqueSizes.length && message) {
        message.textContent = "Select a size.";
    }
}

/* ---------- Select size ---------- */

function selectVariant(variant) {
    selectedVariant = variant;
    quantity = 1;

    document.querySelectorAll(".size-button").forEach(button => {
        button.classList.remove("selected");

        if (
            String(button.dataset.size) ===
            String(variant.Size)
        ) {
            button.classList.add("selected");
        }
    });

    const price = Number(variant.Price || 0);

    document.getElementById("productPrice").textContent =
        "₹" + formatMoney(price);

    const compare = Number(variant.ComparePrice || 0);

    document.getElementById("comparePrice").textContent =
        compare > 0
        ? "₹" + formatMoney(compare)
        : "";

    document.getElementById("quantity").textContent = quantity;

    document.getElementById("stockMessage").textContent =
        stockMessage(Number(variant.Stock || 0));

    const addButton =
        document.getElementById("addCartButton");

    const buyButton =
        document.getElementById("buyNowButton");

    addButton.disabled = false;
    buyButton.disabled = false;

    addButton.textContent = "ADD TO CART";
    buyButton.textContent = "BUY NOW";

    updateQuantityButtons();
}

/* ---------- Stock ---------- */

function stockMessage(stock) {
    if (stock <= 0) return "Out of stock.";

    if (stock <= 5) {
        return "Only " + stock + " left in stock.";
    }

    return stock + " available.";
}

/* ---------- Quantity ---------- */

function increaseQuantity() {
    if (!selectedVariant) return;

    const stock = Number(selectedVariant.Stock || 0);

    if (quantity < stock) {
        quantity++;
    }

    document.getElementById("quantity").textContent = quantity;
    updateQuantityButtons();
}

function decreaseQuantity() {
    if (quantity > 1) {
        quantity--;
    }

    document.getElementById("quantity").textContent = quantity;
    updateQuantityButtons();
}

function updateQuantityButtons() {
    if (!selectedVariant) return;

    const stock = Number(selectedVariant.Stock || 0);

    document.getElementById("minusButton").disabled =
        quantity <= 1;

    document.getElementById("plusButton").disabled =
        quantity >= stock;
}

/* ---------- Add to cart ---------- */

function handleAddToCart() {

    if (!selectedVariant) {
        alert("Please select a size.");
        return;
    }

    const stock = Number(selectedVariant.Stock || 0);

    if (stock <= 0) {
        alert("This size is out of stock.");
        return;
    }

    const productID = String(getValue(
        currentProduct,
        ["ProductID", "productID", "productId", "ProductId"],
        ""
    ));

    const productName = String(getValue(
        currentProduct,
        ["ProductName", "productName", "name"],
        ""
    ));

    const existing = cart.find(
        item =>
            String(item.ProductID) === productID &&
            String(item.VariantID) ===
            String(selectedVariant.VariantID)
    );

    if (existing) {

        const newQuantity =
            Number(existing.quantity || 0) + quantity;

        if (newQuantity > stock) {
            alert("Only " + stock + " available.");
            return;
        }

        existing.quantity = newQuantity;

    } else {

        cart.push({
            ProductID: productID,
            VariantID: selectedVariant.VariantID,
            SKU: selectedVariant.SKU,
            ProductName: productName,

            Color:
                getValue(
                    currentProduct,
                    ["Color", "color"],
                    ""
                ) ||
                selectedVariant.ColorCode ||
                "",

            ColorCode:
                selectedVariant.ColorCode || "",

            Size: selectedVariant.Size,

            Price:
                Number(selectedVariant.Price) || 0,

            ComparePrice:
                Number(selectedVariant.ComparePrice) || 0,

            Stock: stock,

            Image:
                getValue(
                    currentProduct,
                    ["MainImage", "mainImage"],
                    ""
                ) ||
                selectedVariant.Image ||
                "",

            quantity: quantity
        });
    }

    localStorage.setItem(
        "urbnvybe_cart",
        JSON.stringify(cart)
    );

    updateCartCount();

    alert(
        productName +
        " (" +
        selectedVariant.Size +
        ") added to cart!"
    );
}

/* ---------- Buy now ---------- */

function handleBuyNow() {

    if (!selectedVariant) {
        alert("Please select a size.");
        return;
    }

    handleAddToCart();

    /*
      Cart is already updated.
      Send customer directly to the checkout page.
    */
    window.location.href = "checkout.html";
}

/* ---------- Cart ---------- */

function showCart() {
    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    let message = "YOUR CART\n\n";
    let total = 0;

    cart.forEach(item => {

        const itemTotal =
            Number(item.Price) *
            Number(item.quantity);

        total += itemTotal;

        message +=
            item.ProductName +
            "\nSize: " + item.Size +
            "\nSKU: " + item.SKU +
            "\nQty: " + item.quantity +
            " = ₹" + itemTotal +
            "\n\n";
    });

    message += "TOTAL: ₹" + total;

    alert(message);
}

/* ---------- Image change ---------- */

function changeImage(image, thumbnail) {

    const main =
        document.getElementById("mainProductImage");

    if (main) {
        main.src = image;
    }

    document.querySelectorAll(".thumbnail").forEach(item => {
        item.classList.remove("active");
    });

    if (thumbnail) {
        thumbnail.classList.add("active");
    }
}

/* ---------- Money ---------- */

function formatMoney(value) {
    const number = Number(value || 0);

    return number.toLocaleString("en-IN");
}

/* ---------- HTML escape ---------- */

function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ---------- JavaScript string escape ---------- */

function escapeJS(value) {
    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\r?\n/g, "\\n");
}

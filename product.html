<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Product | URBNVYBE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    color: #111;
}

/* =========================
   HEADER
========================= */

header {
    background: #111;
    color: white;

    position: sticky;
    top: 0;
    z-index: 100;
}

.nav {
    max-width: 1200px;
    margin: auto;

    height: 70px;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: white;
    text-decoration: none;

    font-size: 25px;
    font-weight: 800;

    letter-spacing: 3px;
}

.nav-right {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-right a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.cart {
    cursor: pointer;
}

/* =========================
   PRODUCT
========================= */

.product-container {
    max-width: 1200px;

    margin: 50px auto;

    padding: 0 20px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 60px;
}

/* =========================
   GALLERY
========================= */

.gallery {
    background: white;

    border-radius: 10px;

    padding: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.main-image {
    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f3f3f3;

    border-radius: 8px;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.thumbnail-container {
    display: flex;

    gap: 10px;

    margin-top: 15px;

    overflow-x: auto;
}

.thumbnail {
    width: 75px;
    height: 75px;

    flex-shrink: 0;

    border: 2px solid transparent;

    border-radius: 5px;

    overflow: hidden;

    cursor: pointer;

    background: #eee;
}

.thumbnail.active {
    border-color: #111;
}

.thumbnail img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================
   PRODUCT INFO
========================= */

.product-info {
    padding-top: 10px;
}

.category {
    color: #777;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 12px;
}

.product-title {
    font-size: 38px;

    line-height: 1.1;

    margin-bottom: 15px;
}

.description {
    color: #555;

    line-height: 1.7;

    margin: 20px 0;
}

/* =========================
   PRICE
========================= */

.price-row {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 20px 0;
}

.price {
    font-size: 30px;

    font-weight: 800;
}

.compare-price {
    color: #999;

    text-decoration: line-through;

    font-size: 18px;
}

/* =========================
   OPTIONS
========================= */

.option {
    margin: 25px 0;
}

.option-title {
    font-weight: 700;

    margin-bottom: 10px;
}

.size-buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.size-button {
    min-width: 50px;

    padding: 11px 15px;

    background: white;

    border: 1px solid #ccc;

    cursor: pointer;

    border-radius: 4px;

    font-weight: 600;
}

.size-button:hover:not(:disabled) {
    border-color: #111;
}

.size-button.selected {
    background: #111;
    color: white;

    border-color: #111;
}

.size-button:disabled {
    background: #eee;

    color: #999;

    border-color: #ddd;

    cursor: not-allowed;

    text-decoration: line-through;
}

.stock-message {
    margin-top: 10px;

    font-size: 13px;

    color: #555;
}

/* =========================
   QUANTITY
========================= */

.quantity-box {
    display: flex;

    align-items: center;

    width: fit-content;

    border: 1px solid #ccc;

    background: white;

    border-radius: 4px;

    overflow: hidden;
}

.quantity-box button {
    width: 42px;

    height: 42px;

    border: 0;

    background: white;

    font-size: 20px;

    cursor: pointer;
}

.quantity-box button:disabled {
    color: #aaa;

    cursor: not-allowed;
}

.quantity-box span {
    width: 45px;

    text-align: center;

    font-weight: bold;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;

    gap: 10px;

    margin-top: 25px;
}

.add-cart,
.buy-now {
    flex: 1;

    padding: 15px;

    border-radius: 4px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;
}

.add-cart {
    background: white;

    color: #111;

    border: 1px solid #111;
}

.buy-now {
    background: #111;

    color: white;

    border: 1px solid #111;
}

.add-cart:disabled,
.buy-now:disabled {
    opacity: .5;

    cursor: not-allowed;
}

/* =========================
   DETAILS
========================= */

.details {
    max-width: 1200px;

    margin: 0 auto 60px;

    padding: 0 20px;
}

.detail-box {
    background: white;

    padding: 30px;

    border-radius: 10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.05);
}

.detail-box h2 {
    margin-bottom: 15px;
}

.detail-box p {
    color: #555;

    line-height: 1.7;
}

/* =========================
   LOADING
========================= */

.message {
    text-align: center;

    padding: 100px 20px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .product-container {
        grid-template-columns: 1fr;

        gap: 30px;
    }

    .product-title {
        font-size: 30px;
    }

    .product-info {
        padding-top: 0;
    }

    .actions {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<header>

<div class="nav">

<a href="index.html"
   class="logo">

URBNVYBE

</a>

<div class="nav-right">

<a href="index.html">
SHOP
</a>

<div class="cart"
     onclick="showCart()">

🛒 Cart
(<span id="cartCount">0</span>)

</div>

</div>

</div>

</header>


<div id="page">

<div class="message">

Loading product...

</div>

</div>


<script>
const API_BASE="https://script.google.com/macros/s/AKfycbzzW9XtaXrMbm2YS1CFpoBu4tz2h2huBGNwmybtB36OFC3HQ02A7EoXhHZFmf-5O2ohFQ/exec";
const API_URL=API_BASE+"?action=products";
const params=new URLSearchParams(window.location.search);
const productId=params.get("id");

let cart=JSON.parse(localStorage.getItem("urbnvybe_cart")||"[]");
let currentProduct=null,variants=[],selectedVariant=null,quantity=1;

function updateCartCount(){
  const n=cart.reduce((t,i)=>t+Number(i.quantity||0),0);
  const e=document.getElementById("cartCount"); if(e)e.textContent=n;
}
function asArray(v){
  if(Array.isArray(v))return v;
  if(typeof v==="string"&&v.trim()){try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch(e){}}
  return [];
}

async function loadProduct(){
  const page=document.getElementById("page");
  if(!productId){showError("Product ID is missing.");return;}
  try{
    const r=await fetch(API_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("Unable to connect to the store API.");
    const data=await r.json();
    if(!data.success)throw new Error(data.error||"Unable to load products.");

    const product=(data.products||[]).find(p=>String(p.ProductID||"").trim()===String(productId).trim());
    if(!product)throw new Error("Product not found.");
    currentProduct=product;

    variants=asArray(product.variants);
    if(!variants.length)variants=asArray(data.variants).filter(v=>String(v.ProductID||"").trim()===String(product.ProductID).trim());

    /* Fallback for APIs that expose a separate variants action. */
    if(!variants.length){
      try{
        const vr=await fetch(API_BASE+"?action=variants&productId="+encodeURIComponent(product.ProductID),{cache:"no-store"});
        if(vr.ok){
          const vd=await vr.json();
          if(vd.success)variants=asArray(vd.variants).length?asArray(vd.variants):asArray(vd.data);
        }
      }catch(e){console.warn("Variant fallback:",e);}
    }

    variants=variants.map(v=>({
      VariantID:v.VariantID||"",
      ProductID:v.ProductID||product.ProductID,
      SKU:v.SKU||"",
      ColorCode:v.ColorCode||product.ColorCode||"",
      Size:String(v.Size||"").trim(),
      Price:Number(v.Price||product.Price||0),
      ComparePrice:Number(v.ComparePrice||product.ComparePrice||0),
      Stock:Number(v.Stock||0),
      Status:String(v.Status||"Active").trim(),
      Image:v.Image||""
    })).filter(v=>
      String(v.ProductID).trim()===String(product.ProductID).trim() &&
      v.Size!=="" &&
      String(v.Status).toLowerCase()==="active"
    );

    document.title=(product.ProductName||"Product")+" | URBNVYBE";
    renderProduct(product);
  }catch(e){console.error(e);showError(e.message||"Unable to load product.");}
}

function showError(message){
  document.getElementById("page").innerHTML=`<div class="message"><h2>Unable to load product</h2><p style="margin-top:15px;">${escapeHTML(message)}</p><p style="margin-top:20px;"><a href="index.html">Back to Shop</a></p></div>`;
}

function renderProduct(product){
  const page=document.getElementById("page");
  const images=[product.MainImage,product.BackImage,product.SideImage,product.SleeveImage,product.CollarImage,product.ModelImage].filter(x=>x&&String(x).trim()!=="");
  if(!images.length)images.push("");

  page.innerHTML=`
  <div class="product-container">
    <div class="gallery">
      <div class="main-image">${images[0]?`<img id="mainProductImage" src="${escapeHTML(images[0])}" alt="${escapeHTML(product.ProductName||"Product")}">`:`<span>Product Image</span>`}</div>
      <div class="thumbnail-container">${images.map((im,i)=>im?`<div class="thumbnail ${i===0?"active":""}" onclick="changeImage('${escapeJS(im)}',this)"><img src="${escapeHTML(im)}" alt="Product view"></div>`:"").join("")}</div>
    </div>
    <div class="product-info">
      <div class="category">${escapeHTML(product.Category||"")}</div>
      <h1 class="product-title">${escapeHTML(product.ProductName||"")}</h1>
      <div class="price-row"><span class="price" id="productPrice">₹${formatMoney(product.Price)}</span><span class="compare-price" id="comparePrice">${Number(product.ComparePrice||0)>0?"₹"+formatMoney(product.ComparePrice):""}</span></div>
      <div class="description">${escapeHTML(product.Description||"")}</div>
      <div class="option"><div class="option-title">Colour</div><div class="color-value">${escapeHTML(product.Color||product.ColorCode||"Navy Blue")}</div></div>
      <div class="option"><div class="option-title">Size</div><div id="sizeButtons" class="size-buttons"></div><div id="stockMessage" class="stock-message">Select a size.</div></div>
      <div class="option"><div class="option-title">Quantity</div><div class="quantity-box"><button id="minusButton" onclick="decreaseQuantity()">−</button><span id="quantity">1</span><button id="plusButton" onclick="increaseQuantity()">+</button></div></div>
      <div class="actions"><button id="addCartButton" class="add-cart" onclick="handleAddToCart()" disabled>SELECT SIZE</button><button id="buyNowButton" class="buy-now" onclick="handleBuyNow()" disabled>SELECT SIZE</button></div>
    </div>
  </div>
  <div class="details"><div class="detail-box"><h2>Product Details</h2><p>${escapeHTML(product.Description||"Premium quality product designed for everyday comfort and style.")}</p>${product.Material?`<p style="margin-top:15px;"><strong>Material:</strong> ${escapeHTML(product.Material)}</p>`:""}${product.Gender?`<p><strong>Gender:</strong> ${escapeHTML(product.Gender)}</p>`:""}</div></div>`;
  renderVariants();
}

function renderVariants(){
  const c=document.getElementById("sizeButtons");if(!c)return;c.innerHTML="";
  if(!variants.length){c.innerHTML="<span>No sizes available.</span>";document.getElementById("stockMessage").textContent="No active sizes are available.";return;}

  const order=["XS","S","M","L","XL","XXL","3XL","4XL","5XL"],sizes=[];
  variants.forEach(v=>{if(v.Size&&!sizes.includes(v.Size))sizes.push(v.Size);});
  sizes.sort((a,b)=>{const ai=order.indexOf(a.toUpperCase()),bi=order.indexOf(b.toUpperCase());if(ai>=0&&bi>=0)return ai-bi;if(ai>=0)return-1;if(bi>=0)return 1;return a.localeCompare(b);});

  sizes.forEach(size=>{
    const group=variants.filter(v=>v.Size.toUpperCase()===size.toUpperCase());
    const v=group.find(x=>x.Stock>0)||group[0],stock=Number(v.Stock||0);
    const b=document.createElement("button");b.type="button";b.className="size-button";b.textContent=size;b.dataset.size=size;
    if(stock<=0){b.disabled=true;b.title="Out of stock";}else b.onclick=()=>selectVariant(v);
    c.appendChild(b);
  });
}

function selectVariant(v){
  selectedVariant=v;quantity=1;
  document.querySelectorAll(".size-button").forEach(b=>b.classList.toggle("selected",b.dataset.size.toUpperCase()===String(v.Size).toUpperCase()));
  document.getElementById("productPrice").textContent="₹"+formatMoney(v.Price);
  document.getElementById("comparePrice").textContent=Number(v.ComparePrice)>0?"₹"+formatMoney(v.ComparePrice):"";
  document.getElementById("quantity").textContent=quantity;
  document.getElementById("stockMessage").textContent=stockMessage(v.Stock);
  const ok=Number(v.Stock)>0;
  const a=document.getElementById("addCartButton"),b=document.getElementById("buyNowButton");
  a.disabled=!ok;b.disabled=!ok;a.textContent=ok?"ADD TO CART":"OUT OF STOCK";b.textContent=ok?"BUY NOW":"OUT OF STOCK";
  updateQuantityButtons();
}
function stockMessage(s){return s<=0?"Out of stock.":s<=5?"Only "+s+" left in stock.":s+" available.";}
function increaseQuantity(){if(!selectedVariant)return;const s=Number(selectedVariant.Stock||0);if(quantity<s)quantity++;document.getElementById("quantity").textContent=quantity;updateQuantityButtons();}
function decreaseQuantity(){if(quantity>1)quantity--;document.getElementById("quantity").textContent=quantity;updateQuantityButtons();}
function updateQuantityButtons(){const m=document.getElementById("minusButton"),p=document.getElementById("plusButton");if(!m||!p)return;if(!selectedVariant){m.disabled=p.disabled=true;return;}const s=Number(selectedVariant.Stock||0);m.disabled=quantity<=1;p.disabled=quantity>=s;}

function handleAddToCart(){
  if(!selectedVariant){alert("Please select a size.");return;}
  const stock=Number(selectedVariant.Stock||0);if(stock<=0){alert("This size is out of stock.");return;}
  const existing=cart.find(i=>String(i.ProductID)===String(currentProduct.ProductID)&&String(i.VariantID)===String(selectedVariant.VariantID));
  if(existing){if(Number(existing.quantity)+quantity>stock){alert("Only "+stock+" available.");return;}existing.quantity=Number(existing.quantity)+quantity;}
  else cart.push({
    ProductID:currentProduct.ProductID,VariantID:selectedVariant.VariantID,SKU:selectedVariant.SKU,
    ProductName:currentProduct.ProductName,Color:currentProduct.Color||selectedVariant.ColorCode||"",
    ColorCode:selectedVariant.ColorCode||"",Size:selectedVariant.Size,Price:Number(selectedVariant.Price||0),
    ComparePrice:Number(selectedVariant.ComparePrice||0),Stock:stock,
    Image:currentProduct.MainImage||selectedVariant.Image||"",quantity:quantity
  });
  localStorage.setItem("urbnvybe_cart",JSON.stringify(cart));updateCartCount();
  alert(currentProduct.ProductName+" ("+selectedVariant.Size+") added to cart!");
}

function handleBuyNow(){
  if(!selectedVariant){alert("Please select a size.");return;}
  handleAddToCart();
  setTimeout(()=>window.location.href="cart.html",100);
}
function showCart(){window.location.href="cart.html";}
function changeImage(image,thumb){const m=document.getElementById("mainProductImage");if(m)m.src=image;document.querySelectorAll(".thumbnail").forEach(x=>x.classList.remove("active"));thumb.classList.add("active");}
function formatMoney(v){return Number(v||0).toLocaleString("en-IN");}
function escapeHTML(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function escapeJS(v){return String(v||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\r?\n/g,"\\n");}

updateCartCount();
loadProduct();
</script>

</body>

</html>
